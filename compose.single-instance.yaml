# Single-instance fallback: the development stack with no development defaults.
#
#   docker compose -f compose.yaml -f compose.single-instance.yaml up -d
#
# Every password and the encryption keyring must come from the environment
# (or a git-ignored .env; see .env.example). A missing one stops Compose before anything
# starts, instead of silently falling back to the published development values.

x-db-password: &db-password
  ARGUS_DB_PASSWORD: ${ARGUS_DB_PASSWORD:?set ARGUS_DB_PASSWORD (Postgres owner password)}

x-keyring: &keyring
  ARGUS_SECRET_KEYS: ${ARGUS_SECRET_KEYS:?set ARGUS_SECRET_KEYS (admin-tools new-secret-key)}
  ARGUS_SECRET_KEY_ID: ${ARGUS_SECRET_KEY_ID:?set ARGUS_SECRET_KEY_ID}

services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${ARGUS_DB_PASSWORD:?set ARGUS_DB_PASSWORD (Postgres owner password)}

  migrate:
    environment:
      <<: *db-password
      ARGUS_API_DB_PASSWORD: ${ARGUS_API_DB_PASSWORD:?set ARGUS_API_DB_PASSWORD}
      ARGUS_WORKER_DB_PASSWORD: ${ARGUS_WORKER_DB_PASSWORD:?set ARGUS_WORKER_DB_PASSWORD}

  api:
    environment:
      <<: *keyring
      ARGUS_DB_PASSWORD: ${ARGUS_API_DB_PASSWORD:?set ARGUS_API_DB_PASSWORD}

  worker:
    environment:
      <<: *keyring
      ARGUS_DB_PASSWORD: ${ARGUS_WORKER_DB_PASSWORD:?set ARGUS_WORKER_DB_PASSWORD}

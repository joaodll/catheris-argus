# Prowler, unmodified (ADR-0001), installed into its own venv (/opt/prowler) in the worker
# image. Locked like every other Python dependency: uv.lock beside this file, installed
# --frozen. Upgrading: change the pin, re-lock, then refresh the adapter fixtures together.
[project]
name = "argus-prowler"
version = "5.45.0"
requires-python = ">=3.13,<3.14"
dependencies = ["prowler==5.45.0"]

[tool.uv]
package = false
# Prowler's own lock carries the same override (pyproject.toml at 5.45.0): huaweicloudsdkcore
# pins pymongo==4.15.1 exactly and only uses its bson types, so its official image ships 4.18.2
# (CVE-2026-96748, CVE-2026-96749). Drop it when a Prowler release no longer needs it.
override-dependencies = ["pymongo==4.18.2"]

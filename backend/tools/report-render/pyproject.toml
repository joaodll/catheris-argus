# The report renderer (ADR-0047): Jinja2 and WeasyPrint in their own venv (/opt/report-render),
# in the reports and worker images only, never the API image. Locked like every other Python
# dependency: uv.lock beside this file, installed --frozen.
[project]
name = "argus-report-render"
version = "1.0.0"
requires-python = ">=3.13,<3.14"
dependencies = ["jinja2==3.1.6", "weasyprint==70.0"]

[tool.uv]
package = false

id = "internet-exposed-admin-port"
version = 1
name = "Exposed on an administrative or data port"
category = "Internet exposure"
severity = "high"
technique = "T1133"  # External Remote Services
description = """The internet reaches a resource on a port meant for administrators or for
data: remote access (SSH, RDP, Telnet, FTP), directories (Kerberos, LDAP), file sharing (SMB),
or a database or cache (PostgreSQL, MySQL, SQL Server, Oracle, MongoDB, Redis, Memcached,
Cassandra, Elasticsearch, Kafka), or on every port. These are the ports of Prowler 5.44.0's
ec2_instance_port_* checks. Anyone on the internet can try a password, a key or an exploit on
it. On a Restricted door the path is latent: one change would open it."""
remediation = """Close the port to 0.0.0.0/0 and ::/0 in its security groups. Reach the resource
through Session Manager, a VPN or a bastion, and keep databases and caches in private subnets
with no public address."""
# The door itself is the target: one step from the internet (ADR-0037, second amendment).
entry_only = true
sql = """
SELECT d.uid FROM d WHERE d.admin_port
"""

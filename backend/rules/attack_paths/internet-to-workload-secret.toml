id = "internet-to-workload-secret"
version = 1
name = "From the internet to a secret in a workload's environment"
category = "Credential access"
severity = "medium"
technique = "T1552.001"  # Unsecured Credentials: Credentials In Files
description = """The internet reaches a workload, directly or through the steps before it, that
keeps a secret-like environment variable (CloudFox's env-vars: a key, password or token by its
name). Whoever runs code in it, or reads its configuration, reads the secret. Argus keeps the
variable's name only, never its value."""
remediation = """Move the secret to Secrets Manager or Parameter Store and read it at run time with
the workload's role; rotate the one that was in the environment."""
# The workload itself may be the door (a function URL): one step, or more.
entry_too = true
sql = """
SELECT DISTINCT f.resource_uid FROM f WHERE f.check_id = 'cloudfox_env_var_secret'
"""

id = "internet-to-data"
version = 3
name = "From the internet to a data store"
category = "Public data exposure"
severity = "medium"
technique = "T1530"  # Data from Cloud Storage
# Version 2 (ADR-0037, second amendment): never the door itself, which is an exposure path
# (internet-exposed-admin-port, internet-exposed); a grant on every store of a service counts
# (any:s3, any:dynamodb, any:secretsmanager).
# Version 3 (ADR-0052 §6, kind 6; P1 R0): a distribution's own origin bucket is a static site,
# not a data path, so a route whose last step is cloudfront-origin into a bucket counts only when
# the bucket fails one of Prowler's data-exposure checks (attackpaths.walk.EXPOSURE_CHECKS). A
# database reached with no credential or role step before it needs authentication Argus can't
# see: the route gets an "authenticates" step (data_auth_assumed), so it is Potential at best.
description = """The internet reaches a data store: one a workload's role can read or write, by
name or through a grant on every store of a service, a bucket behind a distribution that is
public itself, or a database whose network is open. Whoever takes control of the workload, or
holds a database login, reaches the data behind it."""
remediation = """Remove public access (turn off a database's public accessibility, keep Block
Public Access on buckets, use a private origin), or narrow the workload's role to the data it needs and require
authentication in front of it."""
sql = """
SELECT r.uid FROM r
WHERE r.type IN ('aws_s3_bucket', 'aws_dynamodb_table', 'aws_rds_db_instance',
                 'aws_rds_db_cluster', 'aws_secretsmanager_secret')
UNION
SELECT e.target_uid FROM e
WHERE e.type = 'ACCESSES' AND e.target_uid IN ('any:s3', 'any:dynamodb', 'any:secretsmanager')
"""

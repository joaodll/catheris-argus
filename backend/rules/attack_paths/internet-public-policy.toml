id = "internet-public-policy"
version = 1
name = "Public by its own policy"
category = "Public data exposure"
severity = "high"
technique = "T1530"  # Data from Cloud Storage
description = """A resource's own policy lets anyone in: an Allow statement for any principal
(`*`) on a bucket, queue, topic, function, KMS key, secret or ECR repository. Whoever finds it
can read or write its data, send to it or invoke it, with the actions the statement names, no
network in the way. On a Restricted door (Block Public Access) the path is latent: one change
would open it; on an Unknown one, the statement has a condition Argus does not evaluate."""
remediation = """Remove the statement for "*" from the resource's policy, or name the accounts or
principals that need access. For a bucket, keep Block Public Access on, at the account level
too."""
# The door itself is the target: one step from the internet (ADR-0037, second amendment).
entry_only = true
sql = """
SELECT d.uid FROM d WHERE d.policy
"""

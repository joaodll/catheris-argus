id = "exposed-user-credential"
version = 1
edge_type = "HAS_CREDENTIAL"
description = """An IAM user signs in with a credential that works from anywhere (ADR-0037, second
amendment, wave 2): an active access key, or a console password without MFA. Whoever gets it
acts as the user, so the edge goes from the internet to the user; what the user may do
(role-accesses, principal-admin) is the path after it. A step through it is Candidate: it
assumes the credential leaks. `credentials` names which (access_key, console_password_no_mfa),
`access_keys` how many are active and `oldest_key_created` the oldest one's date. No key id and
no secret value: the key's age and last use stay Prowler's findings."""
sql = """
SELECT 'internet', u.uid,
       jsonb_build_object('credentials', c.credentials)
       || CASE WHEN k.n > 0
               THEN jsonb_build_object('access_keys', k.n, 'oldest_key_created', k.oldest)
               ELSE '{}'::jsonb END
FROM r u
CROSS JOIN LATERAL (
  SELECT count(*) AS n, min(key.config ->> 'create_date') AS oldest
  FROM r key
  WHERE key.type = 'aws_iam_access_key' AND key.config ->> 'user_name' = u.config ->> 'name'
    AND key.config ->> 'status' = 'Active'
) k
CROSS JOIN LATERAL (
  SELECT jsonb_agg(c ORDER BY c) AS credentials
  FROM (
    SELECT 'access_key' AS c WHERE k.n > 0
    UNION ALL
    SELECT 'console_password_no_mfa'
    WHERE jsonb_typeof(u.config -> 'login_profile') = 'object'
      AND NOT COALESCE((u.config ->> 'mfa_enabled')::boolean, false)
  ) x
) c
WHERE u.type = 'aws_iam_user' AND c.credentials IS NOT NULL
"""

id = "log-subscription"
version = 1
edge_type = "TRIGGERS"
description = """A CloudWatch Logs subscription filter sends a log group's events to its
destination: a function, a Kinesis or Firehose stream, a logs destination (ADR-0036). Only the
destination is read, never the log content. Unconfirmed on real output."""
sql = """
SELECT DISTINCT lg.uid,
       COALESCE(substring(sf.config ->> 'destination_arn'
                  from '^(arn[:]aws[a-z-]*[:]lambda[:][a-z0-9-]+[:][0-9]{12}[:]function[:][A-Za-z0-9_-]+)'),
                sf.config ->> 'destination_arn'),
       jsonb_build_object('filter', sf.native_id)
FROM r sf
JOIN r lg ON lg.type = 'aws_cloudwatch_log_group' AND lg.region = sf.region
         AND lg.config ->> 'name' = sf.config ->> 'log_group_name'
WHERE sf.type = 'aws_cloudwatch_log_subscription_filter'
  AND sf.config ->> 'destination_arn' LIKE 'arn%'
"""

id = "access-key-user"
version = 1
edge_type = "BELONGS_TO"
description = "An IAM access key belongs to its user: whoever holds the key acts as that user."
sql = """
SELECT k.uid, u.uid, jsonb_build_object('status', k.config ->> 'status')
FROM r k
JOIN r u ON u.type = 'aws_iam_user' AND u.config ->> 'name' = k.config ->> 'user_name'
WHERE k.type = 'aws_iam_access_key'
"""

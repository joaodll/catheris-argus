id = "load-balancer-target"
version = 3
edge_type = "ROUTES_TO"
description = """A load balancer routes to its target groups, and a target group to what is
registered in it: instances, Lambda functions, another load balancer, or the ECS services that
attach to it. An IP target is resolved through the network interface that holds the address,
in the target group's VPC, to its instance (version 3, ADR-0036); an IP that no ECS service and
no instance owns becomes external:<ip>. A classic load balancer routes to its instances.
(Version 1 linked load balancer to instance directly; ADR-0033.)"""
sql = """
SELECT lb.uid, tg.uid,
       jsonb_build_object('port', (tg.config ->> 'port')::int, 'protocol', tg.config ->> 'protocol')
FROM r tg
CROSS JOIN LATERAL jsonb_array_elements_text(
  CASE WHEN jsonb_typeof(tg.config -> 'load_balancer_arns') = 'array'
       THEN tg.config -> 'load_balancer_arns' ELSE '[]' END) AS lbarn(arn)
JOIN r lb ON lb.uid = lbarn.arn
WHERE tg.type = 'aws_ec2_target_group'
UNION ALL
SELECT tg.uid,
       CASE tg.config ->> 'target_type'
         WHEN 'instance' THEN i.uid
         WHEN 'ip' THEN COALESCE(ei.uid, 'external:' || (d -> 'Target' ->> 'Id'))
         ELSE d -> 'Target' ->> 'Id' END,
       jsonb_build_object('port', (d -> 'Target' ->> 'Port')::int)
FROM r tg
CROSS JOIN LATERAL jsonb_array_elements(
  CASE WHEN jsonb_typeof(tg.config -> 'target_health_descriptions') = 'array'
       THEN tg.config -> 'target_health_descriptions' ELSE '[]' END) AS d
LEFT JOIN r i ON i.type = 'aws_ec2_instance' AND i.native_id = d -> 'Target' ->> 'Id'
LEFT JOIN LATERAL (
  SELECT inst.uid FROM r eni
  JOIN r inst ON inst.type = 'aws_ec2_instance'
             AND inst.native_id = eni.config ->> 'attached_instance_id'
  WHERE tg.config ->> 'target_type' = 'ip' AND eni.type = 'aws_ec2_network_interface'
    AND eni.config ->> 'private_ip_address' = d -> 'Target' ->> 'Id'
    AND eni.vpc_id IS NOT DISTINCT FROM tg.vpc_id
  ORDER BY inst.uid LIMIT 1) ei ON true
WHERE tg.type = 'aws_ec2_target_group'
  AND ((tg.config ->> 'target_type' = 'instance' AND i.uid IS NOT NULL)
    OR (tg.config ->> 'target_type' IN ('lambda', 'alb') AND d -> 'Target' ->> 'Id' LIKE 'arn%')
    OR (tg.config ->> 'target_type' = 'ip' AND NOT EXISTS (
          SELECT 1 FROM r svc
          CROSS JOIN LATERAL jsonb_array_elements(
            CASE WHEN jsonb_typeof(svc.config -> 'load_balancers') = 'array'
                 THEN svc.config -> 'load_balancers' ELSE '[]' END) AS slb
          WHERE svc.type = 'aws_ecs_service' AND slb ->> 'TargetGroupArn' = tg.uid)))
UNION ALL
SELECT DISTINCT tg.uid, svc.uid,
       jsonb_build_object('container', slb ->> 'ContainerName',
                          'port', (slb ->> 'ContainerPort')::int)
FROM r svc
CROSS JOIN LATERAL jsonb_array_elements(
  CASE WHEN jsonb_typeof(svc.config -> 'load_balancers') = 'array'
       THEN svc.config -> 'load_balancers' ELSE '[]' END) AS slb
JOIN r tg ON tg.type = 'aws_ec2_target_group' AND tg.uid = slb ->> 'TargetGroupArn'
WHERE svc.type = 'aws_ecs_service'
UNION ALL
SELECT lb.uid, i.uid, '{}'::jsonb
FROM r lb
CROSS JOIN LATERAL jsonb_array_elements(
  CASE WHEN jsonb_typeof(lb.config -> 'instances') = 'array'
       THEN lb.config -> 'instances' ELSE '[]' END) AS x
JOIN r i ON i.type = 'aws_ec2_instance' AND i.native_id = x ->> 'InstanceId'
WHERE lb.type = 'aws_ec2_classic_load_balancer'
"""

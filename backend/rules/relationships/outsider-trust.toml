id = "outsider-trust"
version = 1
edge_type = "OUTSIDER"
description = """Someone outside the account controls a principal a role trusts (ADR-0037, second
amendment, wave 2), so the internet reaches the role through it: another account (its root, a
role or a user there, or a bare account id), anyone (`*`), or an OpenID Connect provider whose
trust has no condition on the token's subject (`<provider>:sub`), so any of the provider's
tokens will do (any repository, for GitHub Actions). The edge goes from the internet to the
principal; role-trust's CAN_ASSUME, from the principal to the role, is the move after it.
`kind` is other_account (with `account`), anyone or oidc_no_subject. A principal of the same
account, a service principal and a SAML provider (the organization's own IdP) are not
outsiders."""
sql = """
SELECT DISTINCT 'internet', o.principal,
       jsonb_build_object('kind', o.kind)
       || CASE WHEN o.account IS NOT NULL THEN jsonb_build_object('account', o.account)
               ELSE '{}'::jsonb END
FROM (
  SELECT p.pr AS principal,
         CASE WHEN p.pr = '*' THEN 'anyone' ELSE 'other_account' END AS kind,
         CASE WHEN p.pr = '*' THEN NULL WHEN p.pr ~ '^[0-9]{12}$' THEN p.pr
              ELSE split_part(p.pr, ':', 5) END AS account,
         split_part(role.uid, ':', 5) AS own
  FROM r role
  CROSS JOIN LATERAL jsonb_array_elements(
         CASE WHEN jsonb_typeof(role.config -> 'assume_role_policy_std' -> 'Statement') = 'array'
              THEN role.config -> 'assume_role_policy_std' -> 'Statement' ELSE '[]' END) AS s
  CROSS JOIN LATERAL jsonb_array_elements_text(
         CASE jsonb_typeof(s -> 'Principal' -> 'AWS')
           WHEN 'array' THEN s -> 'Principal' -> 'AWS'
           WHEN 'string' THEN jsonb_build_array(s -> 'Principal' -> 'AWS')
           ELSE CASE WHEN s ->> 'Principal' = '*' THEN '["*"]'::jsonb ELSE '[]'::jsonb END
         END) AS p(pr)
  WHERE role.type = 'aws_iam_role' AND s ->> 'Effect' = 'Allow'
  UNION ALL
  SELECT f.fed, 'oidc_no_subject', NULL, NULL
  FROM r role
  CROSS JOIN LATERAL jsonb_array_elements(
         CASE WHEN jsonb_typeof(role.config -> 'assume_role_policy_std' -> 'Statement') = 'array'
              THEN role.config -> 'assume_role_policy_std' -> 'Statement' ELSE '[]' END) AS s
  CROSS JOIN LATERAL jsonb_array_elements_text(
         CASE jsonb_typeof(s -> 'Principal' -> 'Federated')
           WHEN 'array' THEN s -> 'Principal' -> 'Federated'
           WHEN 'string' THEN jsonb_build_array(s -> 'Principal' -> 'Federated')
           ELSE '[]'::jsonb END) AS f(fed)
  WHERE role.type = 'aws_iam_role' AND s ->> 'Effect' = 'Allow'
    AND split_part(f.fed, ':', 6) LIKE 'oidc-provider/%'
    AND NOT EXISTS (
      SELECT 1
      FROM jsonb_each(CASE WHEN jsonb_typeof(s -> 'Condition') = 'object'
                           THEN s -> 'Condition' ELSE '{}'::jsonb END) AS op(name, keys)
      CROSS JOIN LATERAL jsonb_object_keys(CASE WHEN jsonb_typeof(op.keys) = 'object'
                                                THEN op.keys ELSE '{}'::jsonb END) AS k
      WHERE split_part(lower(k), ':', -1) = 'sub')
) o
WHERE o.kind <> 'other_account' OR o.account IS DISTINCT FROM o.own
"""

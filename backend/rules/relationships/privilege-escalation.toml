id = "privilege-escalation"
version = 1
edge_type = "CAN_ESCALATE_TO"
description = """A role or user can make itself an administrator of its account (ADR-0037,
second amendment, wave 3): its policies, its groups' included (`ps`, `pa`), allow one of the
documented IAM escalation methods (Rhino Security Labs' set), matched on action names with
their wildcards: a policy write (CreatePolicyVersion, SetDefaultPolicyVersion, Attach*Policy,
Put*Policy), a trust edit (UpdateAssumeRolePolicy), a credential (CreateAccessKey,
CreateLoginProfile, UpdateLoginProfile), AddUserToGroup, lambda:UpdateFunctionCode, or
iam:PassRole with a compute create (ec2:RunInstances, lambda:CreateFunction,
cloudformation:CreateStack, glue:CreateDevEndpoint, ecs:RunTask). AWS's IAMFullAccess counts.
`methods` names what matched ("iam:passrole+ec2:runinstances"). Name-level only: which
resources, conditions, boundaries, SCPs and Deny are not evaluated (`unevaluated`), so a step
through it is Candidate. Read from Steampipe's policies, not CloudFox's permissions module,
which Argus does not parse yet."""
sql = """
SELECT m.principal, 'admin:' || split_part(m.principal, ':', 5),
       jsonb_build_object(
         'methods', jsonb_agg(DISTINCT m.method ORDER BY m.method),
         'unevaluated', '["boundaries", "conditions", "deny", "resources", "scps"]'::jsonb)
FROM (
  WITH allowed AS (
    SELECT s.principal, lower(a) AS pattern
    FROM ps s
    CROSS JOIN LATERAL jsonb_array_elements_text(
      CASE jsonb_typeof(s.st -> 'Action') WHEN 'array' THEN s.st -> 'Action'
           WHEN 'string' THEN jsonb_build_array(s.st -> 'Action') ELSE '[]'::jsonb END) AS a
    UNION
    SELECT p.principal, 'iam:*' FROM pa p
    WHERE split_part(p.arn, ':', 3) = 'iam' AND split_part(p.arn, ':', 5) = 'aws'
      AND split_part(p.arn, ':', 6) = 'policy/IAMFullAccess'
  ),
  can AS (
    SELECT DISTINCT al.principal, act.name, act.kind
    FROM allowed al
    JOIN (VALUES ('iam:createpolicyversion', 'alone'), ('iam:setdefaultpolicyversion', 'alone'),
                 ('iam:attachuserpolicy', 'alone'), ('iam:attachgrouppolicy', 'alone'),
                 ('iam:attachrolepolicy', 'alone'), ('iam:putuserpolicy', 'alone'),
                 ('iam:putgrouppolicy', 'alone'), ('iam:putrolepolicy', 'alone'),
                 ('iam:updateassumerolepolicy', 'alone'), ('iam:createaccesskey', 'alone'),
                 ('iam:createloginprofile', 'alone'), ('iam:updateloginprofile', 'alone'),
                 ('iam:addusertogroup', 'alone'), ('lambda:updatefunctioncode', 'alone'),
                 ('iam:passrole', 'pass'), ('ec2:runinstances', 'compute'),
                 ('lambda:createfunction', 'compute'), ('cloudformation:createstack', 'compute'),
                 ('glue:createdevendpoint', 'compute'), ('ecs:runtask', 'compute'))
      AS act(name, kind)
      ON act.name LIKE replace(replace(al.pattern, '*', '%'), '?', '_')
  )
  SELECT c.principal, c.name AS method FROM can c WHERE c.kind = 'alone'
  UNION
  SELECT p.principal, p.name || '+' || c.name
  FROM can p JOIN can c ON c.principal = p.principal AND c.kind = 'compute'
  WHERE p.kind = 'pass'
) m
GROUP BY m.principal
"""

id = "sns-subscription"
version = 1
edge_type = "TRIGGERS"
description = """An SNS topic triggers the Lambda functions, SQS queues and Firehose streams
subscribed to it."""
sql = """
SELECT DISTINCT s.config ->> 'topic_arn',
       COALESCE(substring(s.config ->> 'endpoint'
                  from '^(arn[:]aws[a-z-]*[:]lambda[:][a-z0-9-]+[:][0-9]{12}[:]function[:][A-Za-z0-9_-]+)'),
                s.config ->> 'endpoint'),
       jsonb_build_object('protocol', s.config ->> 'protocol')
FROM r s
WHERE s.type = 'aws_sns_topic_subscription'
  AND s.config ->> 'protocol' IN ('lambda', 'sqs', 'firehose')
  AND s.config ->> 'topic_arn' LIKE 'arn%' AND s.config ->> 'endpoint' LIKE 'arn%'
"""

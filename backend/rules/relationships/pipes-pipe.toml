id = "pipes-pipe"
version = 1
edge_type = "TRIGGERS"
description = """An EventBridge pipe carries events from its source to its target, through its
enrichment when it has one (ADR-0036): source -> pipe -> enrichment and target. Unconfirmed on
real output."""
sql = """
SELECT p.config ->> 'source', p.uid, '{}'::jsonb
FROM r p WHERE p.type = 'aws_pipes_pipe' AND p.config ->> 'source' LIKE 'arn%'
UNION
SELECT p.uid, x.arn, jsonb_build_object('role', x.role)
FROM r p
CROSS JOIN LATERAL (VALUES (p.config ->> 'target', 'target'),
                           (p.config ->> 'enrichment', 'enrichment')) AS x(arn, role)
WHERE p.type = 'aws_pipes_pipe' AND x.arn LIKE 'arn%'
"""

id = "internet-unverified"
version = 6
edge_type = "PUBLIC_UNVERIFIED"
description = """Public by its settings, but Argus cannot tell whether the internet reaches it
(ADR-0035, second amendment): a security group, route table or network ACL it depends on is
not in the inventory (never collected, or denied), or it has no subnet. `missing` names each
gap ("route_table:subnet-0a1b"). Missing data never becomes open or closed: it is shown.
Version 3 (ADR-0035, fourth amendment): a default route to a firewall or Gateway Load Balancer
endpoint (vpce-) is unknown (inspection_route:<subnet>).
Version 4 (ADR-0035, fifth amendment): judged per network interface, with `network` and `state`
as evidence.
Version 5 (ADR-0037, second amendment): a resource public by its own policy, `via`
resource_policy (Block Public Access restricts a bucket; a condition is unknown).
Version 6 (ADR-0037, second amendment, wave 3): an instance's metadata service, `imds`
(v1: no tokens required, v2, off)."""
sql = """
SELECT 'internet', p.uid, p.attributes FROM p WHERE p.reach = 'unknown'
"""

id = "resource-in-network"
version = 2
edge_type = "IN_NETWORK"
description = """Instances, databases, functions, ECS services, EKS clusters and node groups and
load balancers sit in subnets; subnets sit in VPCs. (Version 1 covered instances and databases;
ADR-0033.)"""
sql = """
SELECT DISTINCT m.uid, sn.uid, '{}'::jsonb
FROM (
  SELECT x.uid, x.config ->> 'subnet_id' AS sid
  FROM r x WHERE x.type = 'aws_ec2_instance'
  UNION ALL
  SELECT x.uid, s ->> 'SubnetIdentifier'
  FROM r x CROSS JOIN LATERAL jsonb_array_elements(
    CASE WHEN jsonb_typeof(x.config -> 'subnets') = 'array' THEN x.config -> 'subnets' ELSE '[]' END) AS s
  WHERE x.type = 'aws_rds_db_instance'
  UNION ALL
  SELECT x.uid, s #>> '{}'
  FROM r x CROSS JOIN LATERAL jsonb_array_elements(
    CASE WHEN jsonb_typeof(x.config -> 'vpc_subnet_ids') = 'array'
         THEN x.config -> 'vpc_subnet_ids' ELSE '[]' END) AS s
  WHERE x.type = 'aws_lambda_function'
  UNION ALL
  SELECT x.uid, s #>> '{}'
  FROM r x CROSS JOIN LATERAL jsonb_array_elements(
    CASE WHEN jsonb_typeof(x.config -> 'network_configuration' -> 'AwsvpcConfiguration' -> 'Subnets') = 'array'
         THEN x.config -> 'network_configuration' -> 'AwsvpcConfiguration' -> 'Subnets' ELSE '[]' END) AS s
  WHERE x.type = 'aws_ecs_service'
  UNION ALL
  SELECT x.uid, s #>> '{}'
  FROM r x CROSS JOIN LATERAL jsonb_array_elements(
    CASE WHEN jsonb_typeof(x.config -> 'resources_vpc_config' -> 'SubnetIds') = 'array'
         THEN x.config -> 'resources_vpc_config' -> 'SubnetIds' ELSE '[]' END) AS s
  WHERE x.type = 'aws_eks_cluster'
  UNION ALL
  SELECT x.uid, s #>> '{}'
  FROM r x CROSS JOIN LATERAL jsonb_array_elements(
    CASE WHEN jsonb_typeof(x.config -> 'subnets') = 'array' THEN x.config -> 'subnets' ELSE '[]' END) AS s
  WHERE x.type IN ('aws_eks_node_group', 'aws_ec2_classic_load_balancer')
  UNION ALL
  SELECT x.uid, z ->> 'SubnetId'
  FROM r x CROSS JOIN LATERAL jsonb_array_elements(
    CASE WHEN jsonb_typeof(x.config -> 'availability_zones') = 'array'
         THEN x.config -> 'availability_zones' ELSE '[]' END) AS z
  WHERE x.type IN ('aws_ec2_application_load_balancer', 'aws_ec2_network_load_balancer')
) m
JOIN r sn ON sn.type = 'aws_vpc_subnet' AND sn.native_id = m.sid
UNION ALL
SELECT sn.uid, v.uid, '{}'::jsonb
FROM r sn
JOIN r v ON v.type = 'aws_vpc' AND v.native_id = sn.config ->> 'vpc_id'
WHERE sn.type = 'aws_vpc_subnet'
"""

id = "security-group-internet-ingress"
version = 1
edge_type = "ALLOWS_INGRESS"
description = """The internet can reach a security group when one of its ingress rules allows
0.0.0.0/0 or ::/0. The source is the pseudo-node `internet`; ports and protocol are attributes."""
sql = """
SELECT 'internet', sg.uid,
       jsonb_build_object(
         'protocol', rule.config ->> 'ip_protocol',
         'from_port', (rule.config ->> 'from_port')::int,
         'to_port', (rule.config ->> 'to_port')::int,
         'cidr', COALESCE(rule.config ->> 'cidr_ipv4', rule.config ->> 'cidr_ipv6'))
FROM r rule
JOIN r sg ON sg.type = 'aws_vpc_security_group' AND sg.native_id = rule.config ->> 'group_id'
WHERE rule.type = 'aws_vpc_security_group_rule'
  AND rule.config ->> 'type' = 'ingress'
  AND (rule.config ->> 'cidr_ipv4' = '0.0.0.0/0' OR rule.config ->> 'cidr_ipv6' = '::/0')
"""

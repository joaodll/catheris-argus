id = "security-group-internet-ingress"
version = 2
edge_type = "ALLOWS_INGRESS"
description = """The internet can reach a security group when one of its ingress rules allows
0.0.0.0/0 or ::/0. The source is the pseudo-node `internet`; ports and protocol are attributes.
Version 2 (ADR-0035, seventh amendment): or when rules on the same protocol and ports together
cover every address of one family, as 0.0.0.0/1 plus 128.0.0.0/1 do. One edge per block. The
judgement is `g`'s, the one the internet rules read."""
sql = """
SELECT 'internet', sg.uid,
       jsonb_build_object(
         'protocol', g.protocol,
         'from_port', g.from_port,
         'to_port', g.to_port,
         'cidr', g.source)
FROM g
JOIN r sg ON sg.type = 'aws_vpc_security_group' AND sg.native_id = g.group_id
WHERE g.anywhere
"""

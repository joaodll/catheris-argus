id = "role-trust"
version = 2
edge_type = "CAN_ASSUME"
description = """An AWS principal named in a role's trust policy can assume the role. The
principal need not be in this inventory (another account, an account root). Service principals
are not edges: the RUNS_AS rules cover the workloads that use them.
Version 2 (ADR-0037, second amendment, wave 2): a federated principal (an OpenID Connect or SAML
provider) too, its conditions with it; outsider-trust marks the ones outsiders control."""
sql = """
SELECT principal, role.uid,
       jsonb_build_object('condition', COALESCE(s -> 'Condition', '{}'::jsonb))
FROM r role
CROSS JOIN LATERAL jsonb_array_elements(
       COALESCE(role.config -> 'assume_role_policy_std' -> 'Statement', '[]')) AS s
CROSS JOIN LATERAL (
  SELECT x FROM jsonb_array_elements_text(
         CASE jsonb_typeof(s -> 'Principal' -> 'AWS')
           WHEN 'array' THEN s -> 'Principal' -> 'AWS'
           WHEN 'string' THEN jsonb_build_array(s -> 'Principal' -> 'AWS')
           ELSE '[]'::jsonb
         END) AS a(x)
  UNION ALL
  SELECT x FROM jsonb_array_elements_text(
         CASE jsonb_typeof(s -> 'Principal' -> 'Federated')
           WHEN 'array' THEN s -> 'Principal' -> 'Federated'
           WHEN 'string' THEN jsonb_build_array(s -> 'Principal' -> 'Federated')
           ELSE '[]'::jsonb
         END) AS f(x)
) AS p(principal)
WHERE role.type = 'aws_iam_role' AND s ->> 'Effect' = 'Allow'
"""

id = "user-group"
version = 1
edge_type = "MEMBER_OF"
description = """An IAM user is a member of each group it belongs to, and holds the group's
permissions. The group need not be in this inventory."""
sql = """
SELECT u.uid, g ->> 'Arn', '{}'::jsonb
FROM r u
CROSS JOIN LATERAL jsonb_array_elements(
       CASE jsonb_typeof(u.config -> 'groups') WHEN 'array' THEN u.config -> 'groups'
            ELSE '[]'::jsonb END) AS g
WHERE u.type = 'aws_iam_user' AND g ->> 'Arn' LIKE 'arn:%'
"""

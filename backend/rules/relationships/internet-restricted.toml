id = "internet-restricted"
version = 7
edge_type = "PUBLIC_RESTRICTED"
description = """Public by its settings, but the internet cannot reach it (ADR-0035): an
internet-facing load balancer, a public instance or a publicly accessible database whose
security groups admit only address lists, other security groups or prefix lists; a function
URL with IAM auth; an EKS endpoint or a REST API limited to source addresses. Version 2
(ADR-0035, second amendment) also restricts a resource with no route to an internet gateway
(no_internet_route) or a network ACL that keeps the internet out (nacl_blocks), and judges
IPv4 and IPv6 apart. The reason and the admitted sources are attributes. CloudFox's endpoints
module reports these as public: this edge is what Argus checks it against.
Version 4 (ADR-0035, fourth amendment): restricted VPC resources carry open_ports, listens and
(no route) default_routes; a running instance with no public address whose groups open a port
to the internet is restricted (no_public_address).
Version 5 (ADR-0035, fifth amendment): an instance that is pending, stopping or stopped is
restricted (not_running) when its groups open a port to the internet; per network interface, so
an open group on a private interface gives no_public_address; an ICMP-only group opens nothing;
every door carries `network` and `state`.
Version 6 (ADR-0037, second amendment): a resource public by its own policy, `via`
resource_policy (Block Public Access restricts a bucket; a condition is unknown).
Version 7 (ADR-0037, second amendment, wave 3): an instance's metadata service, `imds`
(v1: no tokens required, v2, off)."""
sql = """
SELECT 'internet', p.uid, p.attributes FROM p WHERE p.reach = 'restricted'
"""

id = "principal-admin"
version = 1
edge_type = "IS_ADMIN"
description = """A role or user is an administrator of its account (ADR-0037, second amendment,
wave 2): it, or a group it belongs to, has AWS's AdministratorAccess attached, or an Allow of
action "*" on resource "*" with no condition, in an inline or customer-managed policy. The
target is admin:<account>, the pseudo-node CloudFox's IS_ADMIN points to as well. This reads
the configuration, it evaluates nothing: a Deny, a permission boundary or an SCP can still
take the power away, listed in `unevaluated`. A step through it is Supported; CloudFox's own,
from its analysis, is Confirmed."""
sql = """
SELECT a.principal, 'admin:' || split_part(a.principal, ':', 5),
       jsonb_build_object(
         'via_policy', jsonb_agg(DISTINCT a.src ORDER BY a.src),
         'unevaluated', '["boundaries", "deny", "scps"]'::jsonb)
FROM (
  SELECT s.principal, s.src FROM ps s
  WHERE COALESCE(s.st -> 'Condition', '{}'::jsonb) = '{}'::jsonb
    AND (s.st -> 'Action' @> '"*"'::jsonb OR s.st -> 'Action' @> '["*"]'::jsonb)
    AND (s.st -> 'Resource' @> '"*"'::jsonb OR s.st -> 'Resource' @> '["*"]'::jsonb)
  UNION
  SELECT a.principal, a.arn FROM pa a
  WHERE split_part(a.arn, ':', 3) = 'iam' AND split_part(a.arn, ':', 5) = 'aws'
    AND split_part(a.arn, ':', 6) = 'policy/AdministratorAccess'
) a
GROUP BY a.principal
"""

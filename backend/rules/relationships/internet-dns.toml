id = "internet-dns"
version = 1
edge_type = "PUBLIC_UNVERIFIED"
description = """A public DNS record whose chain ends at something Argus does not judge (argus_v12,
ADR-0035 third amendment): a host outside the inventory, a bucket website, an API custom domain,
a network interface or Elastic IP alone. The record is the door, its reach unknown, and `missing`
names each end ("dns_target:external:status.vendor.example.net"). Not a door: a record in a
private zone; one another record names (the outermost record is the door); a chain that reaches
a resource the exposure view judges (`p`: then the record is drawn in front of that door), or
only resources it judges not public (an internal load balancer, an instance without a public
address)."""
sql = """
SELECT 'internet', q.root,
       jsonb_build_object('via', 'dns', 'missing', q.missing, 'checked', '["dns_chain"]'::jsonb)
FROM (
  WITH RECURSIVE pub AS (
    SELECT rec.uid FROM r rec
    WHERE rec.type = 'aws_route53_record'
      AND NOT EXISTS (SELECT 1 FROM r z
                      WHERE z.type = 'aws_route53_zone' AND z.native_id = rec.config ->> 'zone_id'
                        AND COALESCE((z.config ->> 'private_zone')::boolean, false))
      AND NOT EXISTS (SELECT 1 FROM dt n WHERE n.target = rec.uid)
  ),
  chain(root, node, depth, seen) AS (
    SELECT p.uid, p.uid, 0, ARRAY[p.uid] FROM pub p
    UNION ALL
    SELECT c.root, d.target, c.depth + 1, c.seen || d.target
    FROM chain c JOIN dt d ON d.src = c.node
    WHERE c.depth < 10 AND NOT d.target = ANY(c.seen)
  ),
  ends AS (
    SELECT c.root, c.node,
           EXISTS (SELECT 1 FROM p WHERE p.uid = c.node) AS door,
           EXISTS (SELECT 1 FROM r x WHERE x.uid = c.node AND x.type IN (
             'aws_ec2_application_load_balancer', 'aws_ec2_network_load_balancer',
             'aws_ec2_gateway_load_balancer', 'aws_ec2_classic_load_balancer',
             'aws_ec2_instance', 'aws_rds_db_instance', 'aws_cloudfront_distribution',
             'aws_api_gateway_rest_api', 'aws_api_gatewayv2_api', 'aws_lambda_function',
             'aws_eks_cluster')) AS judged
    FROM chain c
    WHERE c.depth > 0 AND NOT EXISTS (SELECT 1 FROM dt d WHERE d.src = c.node)
  )
  SELECT e.root,
         jsonb_agg(DISTINCT 'dns_target:' || e.node ORDER BY 'dns_target:' || e.node)
           FILTER (WHERE NOT e.judged) AS missing
  FROM ends e
  GROUP BY e.root
  HAVING NOT bool_or(e.door) AND bool_or(NOT e.judged)
) q
"""

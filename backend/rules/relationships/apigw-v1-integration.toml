id = "apigw-v1-integration"
version = 2
edge_type = "ROUTES_TO"
description = """A REST API (API Gateway v1) routes to what its methods integrate with: a Lambda
function (qualifier dropped), an SQS queue, or an HTTP host (a load balancer behind a VPC link,
or external:<host>). One edge per API and target, with its routes ("GET /users")."""
# A colon in a string literal before a word reads as a bind parameter in SQLAlchemy text(),
# so regex colons are written [:].
sql = """
SELECT api.uid, COALESCE(x.arn_target, b.uid, 'external:' || x.host),
       jsonb_build_object('routes', to_jsonb((array_agg(DISTINCT x.route ORDER BY x.route))[1:50]))
FROM (
  SELECT m.region, m.config ->> 'rest_api_id' AS api_id,
         (m.config ->> 'http_method') || ' ' || COALESCE(m.config ->> 'path', '') AS route,
         COALESCE(
           substring(i.uri from '(arn[:]aws[a-z-]*[:]lambda[:][a-z0-9-]+[:][0-9]{12}[:]function[:][A-Za-z0-9_-]+)'),
           CASE WHEN i.uri ~ '[:]sqs[:]path/[0-9]{12}/[^/?]+'
                THEN 'arn:aws:sqs:' || m.region || ':'
                     || substring(i.uri from '[:]sqs[:]path/([0-9]{12})/')
                     || ':' || substring(i.uri from '[:]sqs[:]path/[0-9]{12}/([^/?]+)') END
         ) AS arn_target,
         -- The host alone: never the userinfo, port, path or query, which can hold a token.
         CASE WHEN i.uri ~* '^https?[:]//' THEN
           lower(regexp_replace(rtrim(substring(i.uri from
             '^[A-Za-z][A-Za-z0-9+.-]*[:]//(?:[^/?#]*@)?([A-Za-z0-9.-]+)'), '.'),
             '^dualstack[.]', ''))
         END AS host
  FROM r m
  CROSS JOIN LATERAL (SELECT COALESCE(m.config -> 'method_integration' ->> 'Uri',
                                      m.config -> 'method_integration' ->> 'uri') AS uri) i
  WHERE m.type = 'aws_api_gateway_method' AND i.uri IS NOT NULL
) x
JOIN r api ON api.type = 'aws_api_gateway_rest_api' AND api.native_id = x.api_id
          AND api.region = x.region
LEFT JOIN (SELECT DISTINCT ON (host) host, uid FROM h ORDER BY host, rank, uid) b
       ON b.host = x.host
WHERE x.arn_target IS NOT NULL OR (x.host IS NOT NULL AND x.host <> '')
GROUP BY api.uid, COALESCE(x.arn_target, b.uid, 'external:' || x.host)
"""

# Local development and the single-instance fallback.
# Nothing is installed on the host; every task below is a one-shot service:
#
#   docker compose up -d                 Postgres, migrate, api, worker, web (http://localhost:8080)
#   docker compose run --rm test         pytest against Postgres
#   docker compose run --rm frontend pnpm check   frontend: API client current, lint, type-check, build, unit tests
#   docker compose run --rm e2e          browser walk of every screen against the running stack
#   docker compose --profile dev up frontend-dev   Vite with hot reload on http://localhost:5173
#   docker compose run --rm lint         gitleaks, read-only policy check, ruff, mypy, import-linter
#   docker compose run --rm scan         Trivy: repo files, then the backend, worker and web images (CRITICAL gate)
#   docker compose run --rm scrub-fixtures --run-id ID   spike run -> backend/tests/fixtures
#   docker compose --profile budget run --rm budget   graph and map budgets on an 8 GiB Postgres (Phase 0)
#   docker compose run --rm lock         re-resolve backend/uv.lock after editing pyproject.toml
#     ... lock uv lock --directory tools/prowler   re-resolve Prowler's lock after changing its pin
#   docker compose build migrate worker  build argus-backend:runtime and :worker (needed before `scan`)
#
# On a shared host, add the override that refuses the development defaults:
#   docker compose -f compose.yaml -f compose.single-instance.yaml up -d
#
# Paths are relative to this file. Task services run as ${UID:-1000}:${GID:-1000} so they leave
# no root-owned files in the working tree.

# The project name keeps volume and network names (argus_pgdata, argus_raw, ...) stable.
name: argus

# Database coordinates every backend service shares. Only database settings belong here:
# anything container-specific (paths, the dev rules directory) goes on the service itself.
x-db-env: &db-env
  ARGUS_DB_HOST: postgres
  ARGUS_DB_NAME: argus
  ARGUS_DB_USER: argus
  # Local development only. Never reused anywhere else.
  ARGUS_DB_PASSWORD: ${ARGUS_DEV_DB_PASSWORD:-argus-local-dev}

# Runtime hardening for every service that runs our images or Postgres: no Linux
# capabilities, no privilege escalation through setuid binaries. Memory limits are about 4x the
# peak measured on 2026-10-03 (full test suite, including the 300,000-resource budget test):
# postgres 218 MiB, api 74, worker 57 idle and ingest 181 (in the test process), web 18.
# The MVP gate's 180-day seed (1,620 runs, 2026-10-03) peaked at worker 180, postgres 130.
# Re-measure after the first real AWS run.
x-hardened: &hardened
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

x-backend-dev: &backend-dev
  build:
    context: ./backend
    target: development
  image: argus-backend:development
  user: "${UID:-1000}:${GID:-1000}"
  working_dir: /app
  volumes:
    - ./backend:/app
  environment:
    <<: *db-env
    ARGUS_RULES_DIR: /app/rules   # the bind-mounted source, so rule edits are live
  profiles: [tools]

services:
  postgres:
    image: postgres:17-trixie@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
    environment:
      POSTGRES_DB: argus
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: ${ARGUS_DEV_DB_PASSWORD:-argus-local-dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Not published to the host, and only on the internal `data` network.
    networks: [data]
    <<: *hardened
    # The entrypoint starts as root, fixes the data directory's ownership, then drops to the
    # postgres user (gosu). Those five capabilities are what that needs; nothing else.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    mem_limit: 1g
    pids_limit: 512
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argus -d argus"]
      interval: 2s
      timeout: 3s
      retries: 30

  # One-shot, as the schema owner: migrations, then LOGIN + passwords for the api and worker
  # roles. Every long-running service waits for it to complete.
  migrate:
    image: argus-backend:runtime
    build:
      context: ./backend
      target: runtime
    environment:
      <<: *db-env
      ARGUS_API_DB_PASSWORD: ${ARGUS_DEV_API_DB_PASSWORD:-argus-api-local-dev}
      ARGUS_WORKER_DB_PASSWORD: ${ARGUS_DEV_WORKER_DB_PASSWORD:-argus-worker-local-dev}
      # The first admin, created once while there is no active admin (ADR-0041), from .env: a
      # password or its hash (admin-tools hash-password). Remove it after the first sign-in.
      ARGUS_BOOTSTRAP_ADMIN_USERNAME: ${ARGUS_BOOTSTRAP_ADMIN_USERNAME:-admin}
      ARGUS_BOOTSTRAP_ADMIN_PASSWORD: ${ARGUS_BOOTSTRAP_ADMIN_PASSWORD:-}
      ARGUS_BOOTSTRAP_ADMIN_PASSWORD_HASH: ${ARGUS_BOOTSTRAP_ADMIN_PASSWORD_HASH:-}
      # Before users: an .env that still has the old admin hash becomes that admin.
      ARGUS_ADMIN_USERNAME: ${ARGUS_ADMIN_USERNAME:-}
      ARGUS_ADMIN_PASSWORD_HASH: ${ARGUS_ADMIN_PASSWORD_HASH:-}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "argus.entrypoints.migrate", "--config", "/opt/argus/alembic.ini"]
    restart: "no"
    networks: [data]
    <<: *hardened
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 512m
    pids_limit: 64

  # The HTTP API (/api/v1). Connects as argus_api: data read-only, administration rows only.
  # Not published to the host: the web container proxies /api to it (M7).
  api:
    image: argus-backend:runtime
    environment:
      <<: *db-env
      ARGUS_DB_USER: argus_api
      ARGUS_DB_PASSWORD: ${ARGUS_DEV_API_DB_PASSWORD:-argus-api-local-dev}
      # The operator's limits, from .env (.env.example). The defaults are core/config.py's.
      ARGUS_SESSION_IDLE_MINUTES: ${ARGUS_SESSION_IDLE_MINUTES:-30}
      ARGUS_SESSION_ABSOLUTE_HOURS: ${ARGUS_SESSION_ABSOLUTE_HOURS:-12}
      ARGUS_LOGIN_MAX_FAILURES: ${ARGUS_LOGIN_MAX_FAILURES:-5}
      ARGUS_LOGIN_LOCKOUT_MINUTES: ${ARGUS_LOGIN_LOCKOUT_MINUTES:-15}
      ARGUS_LOGIN_MAX_FAILURES_PER_IP: ${ARGUS_LOGIN_MAX_FAILURES_PER_IP:-20}
      ARGUS_LOGIN_MAX_FAILURES_PER_USERNAME: ${ARGUS_LOGIN_MAX_FAILURES_PER_USERNAME:-100}
      ARGUS_MAX_HISTORY_DAYS: ${ARGUS_MAX_HISTORY_DAYS:-400}
      ARGUS_GRAPH_TIMEOUT_SECONDS: ${ARGUS_GRAPH_TIMEOUT_SECONDS:-120}
      # From .env: docker compose run --rm admin-tools new-secret-key
      ARGUS_SECRET_KEYS: ${ARGUS_SECRET_KEYS:-}
      ARGUS_SECRET_KEY_ID: ${ARGUS_SECRET_KEY_ID:-}
      # Only nginx (web's fixed address on `edge`) may set the client IP. nginx overwrites
      # X-Forwarded-For with the real peer, so a browser can't choose the IP that the sign-in
      # limit and the audit log record. Any other caller is recorded by its own address.
      ARGUS_TRUSTED_PROXIES: 172.31.250.2
      # The Resource map reads the graph (ADR-0044, M3b), by named queries in read transactions.
      # The one login, which Memgraph Community can't limit: the owner's decision of 2026-11-02.
      ARGUS_GRAPH_PASSWORD: ${ARGUS_DEV_GRAPH_PASSWORD:-argus-graph-local-dev}
    networks: [edge, data, graph]
    <<: *hardened
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 256m
    pids_limit: 128
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "argus.entrypoints.api"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  # Rewrites backend/openapi.json from the code (the frontend's client is generated from it).
  openapi:
    <<: *backend-dev
    profiles: [tools]
    network_mode: none
    command: ["python", "-m", "argus.entrypoints.openapi", "/app/openapi.json"]

  # The UI: the built app on unprivileged nginx, which proxies /api to the api service. The only
  # published port, and only on the loopback interface (the UI stays internal until SSO).
  web:
    build:
      context: ./frontend
      target: runtime
    image: argus-web:runtime
    ports:
      - "127.0.0.1:8080:8080"
    # nginx fills its config template with this at start (frontend/nginx/default.conf.template).
    environment:
      ARGUS_API_UPSTREAM: api:8000
    # `default` carries the published port; `edge` reaches the API. Never on `data`.
    networks:
      default: {}
      edge:
        ipv4_address: 172.31.250.2   # the API's only trusted proxy (ARGUS_TRUSTED_PROXIES)
    <<: *hardened
    read_only: true
    # conf.d receives the filled-in config at start.
    tmpfs: [/tmp, "/etc/nginx/conf.d:uid=101,gid=101,mode=0700"]
    mem_limit: 128m
    pids_limit: 64
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  # Frontend tooling: pnpm against the bind-mounted frontend/, plus backend/openapi.json
  # read-only for the client generator. Nothing else from the repository: npm packages run
  # here with network access, and the root holds .env (keys, the admin hash). node_modules
  # and the pnpm store are volumes. Every command first installs from the lockfile, which is a no-op when current.
  #   docker compose run --rm frontend pnpm check
  #   docker compose run --rm frontend pnpm api:generate     after backend/openapi.json changes
  #   docker compose run --rm frontend pnpm install --no-frozen-lockfile   after editing package.json
  frontend: &frontend-tools
    build:
      context: ./frontend
      target: base
    image: argus-frontend:base
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /repo/frontend
    volumes:
      - ./frontend:/repo/frontend
      - ./backend/openapi.json:/repo/backend/openapi.json:ro
      - frontend-node-modules:/repo/frontend/node_modules
      - pnpm-store:/pnpm-store
    environment:
      HOME: /tmp
    profiles: [tools]
    entrypoint: ["sh", "-c", "pnpm install --frozen-lockfile --prefer-offline >/dev/null 2>&1 || pnpm install --frozen-lockfile; exec \"$$@\"", "--"]
    command: ["pnpm", "check"]

  # Vite with hot reload; /api is proxied to the api service.
  frontend-dev:
    <<: *frontend-tools
    profiles: [dev]
    ports:
      - "127.0.0.1:5173:5173"
    networks: [default, edge]
    depends_on:
      api:
        condition: service_healthy
    command: ["pnpm", "dev"]

  # Browser walk (Playwright, Chromium): signs in and visits every screen against `web`,
  # failing on any console error or failed request; screenshots go to frontend/e2e/screens/.
  # Needs ARGUS_E2E_PASSWORD (the admin password) in the environment.
  # It shares web's network namespace and opens http://localhost:8080: browsers keep Secure
  # cookies over plain HTTP only on localhost, as for a person using the published port.
  e2e:
    image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    user: "${UID:-1000}:${GID:-1000}"
    network_mode: "service:web"
    working_dir: /repo/frontend
    volumes:
      - ./frontend:/repo/frontend
      - frontend-node-modules:/repo/frontend/node_modules
    environment:
      HOME: /tmp
      ARGUS_E2E_URL: http://localhost:8080
      ARGUS_E2E_PASSWORD: ${ARGUS_E2E_PASSWORD:-}
    profiles: [tools]
    depends_on:
      web:
        condition: service_healthy
    command: ["npx", "--no-install", "playwright", "test"]

  # Operator helpers for .env: hash-password, new-secret-key.
  admin-tools:
    image: argus-backend:runtime
    profiles: [tools]
    network_mode: none
    entrypoint: ["python", "-m", "argus.entrypoints.admin_tools"]

  # Scheduling, collection, ingest and retention (ADR-0019). The only service that mounts the
  # raw archive. SIGTERM stops claiming; runs in progress finish within the grace period.
  worker:
    # runtime + Prowler, CloudFox and Steampipe export, pinned and unmodified (ADR-0030).
    image: argus-backend:worker
    build:
      context: ./backend
      target: worker
    environment:
      <<: *db-env
      ARGUS_DB_USER: argus_worker
      ARGUS_DB_PASSWORD: ${ARGUS_DEV_WORKER_DB_PASSWORD:-argus-worker-local-dev}
      ARGUS_RAW_ROOT: /var/lib/argus
      # As the API's: retention deletes what is above the bound, so both must hold the same one.
      ARGUS_MAX_HISTORY_DAYS: ${ARGUS_MAX_HISTORY_DAYS:-400}
      ARGUS_GRAPH_TIMEOUT_SECONDS: ${ARGUS_GRAPH_TIMEOUT_SECONDS:-120}
      ARGUS_WORKER_THREADS: "2"
      # 3 connections per run thread, 1 for Test connection, 2 for the graph thread, 2 for the
      # main loop: raise it with the threads, or the worker refuses to start. api, migrate and
      # seed use the default, 10.
      ARGUS_DB_POOL_MAX: "11"
      ARGUS_SECRET_KEYS: ${ARGUS_SECRET_KEYS:-}
      ARGUS_SECRET_KEY_ID: ${ARGUS_SECRET_KEY_ID:-}
      # The graph read model's login (ADR-0044); the worker's graph thread is its only writer.
      ARGUS_GRAPH_PASSWORD: ${ARGUS_DEV_GRAPH_PASSWORD:-argus-graph-local-dev}
    # staging holds an AWS run's raw output until it is uploaded to S3, then the run's folder
    # is deleted; the worker empties it at start (ADR-0032). It is on the host's disk and can
    # hold secret values: use an encrypted disk on a machine that scans a real account.
    volumes:
      - raw:/var/lib/argus
      - staging:/var/lib/argus-staging
    # egress: the only service with a route out, to S3 (raw output) and, later, AWS APIs.
    # graph: Memgraph, which only the worker and the API reach (ADR-0044).
    networks: [data, egress, graph]
    <<: *hardened
    read_only: true
    tmpfs: [/tmp]
    # Prowler and the Go tools are far heavier than ingest (180 MiB measured at the MVP gate).
    # Resize from the first real runs' measurements.
    mem_limit: 4g
    pids_limit: 1024
    depends_on:
      migrate:
        condition: service_completed_successfully
      memgraph:
        condition: service_healthy
    command: ["python", "-m", "argus.entrypoints.worker"]
    restart: unless-stopped
    stop_grace_period: 2m

  # The graph read model (ADR-0044): every connection's current state, rebuilt from Postgres,
  # so its volume needs no backup. Only on the internal `graph` network, never published.
  # Telemetry is off (the image's own memgraph.conf turns it on), and the metrics and monitoring
  # listeners stay on the loopback. 2.0-2.5 GiB held 1M resources and 2.4M edges (2026-10-31).
  memgraph:
    image: memgraph/memgraph:3.13.2@sha256:302a6622a9bd28191818801b7ea6e5931bc1cd0a0d1646333269a2237b1bdcb0
    environment:
      # The first login, created when the volume is new (like POSTGRES_PASSWORD).
      MEMGRAPH_USER: argus
      MEMGRAPH_PASSWORD: ${ARGUS_DEV_GRAPH_PASSWORD:-argus-graph-local-dev}
    command:
      - --telemetry-enabled=false
      - --metrics-address=127.0.0.1
      - --monitoring-address=127.0.0.1
      - --storage-mode=IN_MEMORY_TRANSACTIONAL
      - --storage-wal-enabled=true
      - --storage-snapshot-interval-sec=300
      - --storage-snapshot-on-exit=true
      - --query-execution-timeout-sec=600
      - --memory-limit=3584
      # Community's login can do everything, and the API holds it (ADR-0044, M-2). These keep it
      # to the graph: no reading files, and, with the read-only directory below, no writing a
      # Python query module and running it inside Memgraph.
      - --allow-load-csv=false
      - --log-level=WARNING
      # Logs to stderr only: no log file on a read-only root.
      - --log-file=
      - --also-log-to-stderr=true
    volumes:
      - memgraph-data:/var/lib/memgraph
    networks: [graph]
    <<: *hardened
    read_only: true
    tmpfs:
      - /tmp
      - /var/lib/memgraph/internal_modules:ro
    mem_limit: 4g
    pids_limit: 512
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/7687"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # Developer shortcut: three Demo connections with history. Connects as the API role, the
  # same identity the UI's "add connection" uses, so it proves those grants are enough.
  #   docker compose run --rm seed            (180 days)    ... seed --days 30
  seed:
    image: argus-backend:runtime
    environment:
      <<: *db-env
      ARGUS_DB_USER: argus_api
      ARGUS_DB_PASSWORD: ${ARGUS_DEV_API_DB_PASSWORD:-argus-api-local-dev}
    networks: [data]
    <<: *hardened
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles: [tools]
    entrypoint: ["python", "-m", "argus.entrypoints.seed"]

  # Dev only (ADR-0037): the pinned CloudFox and Steampipe export against a fake AWS, to learn
  # their output (CloudFox's loot files) before a scrubbed real fixture arrives. moto and the
  # runner share an internal network with no route out; the keys are moto's placeholders.
  #   docker compose --profile emulate run --rm emulate     -> <repo>/emulated/ (git-ignored)
  #   ... run --rm emulate --scenario exposure [--prowler]  -> emulated/scenario/ (fixture/ inside)
  moto:
    image: motoserver/moto:5.1.4@sha256:32d7805d8bd4c81db789c4fff2c36f96a8837cbd8e7a3853116b6516b9490dde
    profiles: [emulate]
    networks: [emulate]
    <<: *hardened
    mem_limit: 1g
    # SecurityAudit and ViewOnlyAccess, for the scanner user the harness creates (moto's copies,
    # which may be older than AWS's).
    environment:
      MOTO_IAM_LOAD_MANAGED_POLICIES: "true"
      # Two answers made AWS-shaped at start (backend/tests/tooling/moto_fidelity).
      PYTHONPATH: /moto-fidelity
    volumes:
      - ./backend/tests/tooling/moto_fidelity:/moto-fidelity:ro

  # Runs as the image's own user (as the worker does): CloudFox looks its user up and crashes
  # under a uid /etc/passwd does not list. Its output is left world-writable so the host user
  # can read and delete it; emulated/ must exist and be writable (mkdir -m 0777 emulated).
  emulate:
    image: argus-backend:worker
    profiles: [emulate]
    networks: [emulate]
    <<: *hardened
    read_only: true
    tmpfs: [/tmp]
    # Nothing of Argus's own environment: no database, no secret keys, no AWS profile. The
    # working tree's source, so the harness uses the table options and failure test being edited.
    environment:
      PYTHONPATH: /app/src
    # The tooling folder whole: emulate.py imports the scenario estates and the fixture
    # scrubber's checks beside it (--scenario exposure, 2026-10-21).
    volumes:
      - ./backend/tests/tooling:/tooling:ro
      - ./deploy/aws/scanner-role.yaml:/policy/scanner-role.yaml:ro
      - ./backend/src:/app/src:ro
      - ./emulated:/out
    # CloudFox's two outside files are answered by the harness itself, on 127.0.0.1:443 (it binds
    # 443 as its own user; the network namespace is the container's alone).
    extra_hosts:
      - "api.regional-table.region-services.aws.a2z.com:127.0.0.1"
      - "raw.githubusercontent.com:127.0.0.1"
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "443"
    depends_on: [moto]
    entrypoint: ["python", "/tooling/emulate.py", "--endpoint", "http://moto:5000", "--out", "/out"]

  test:
    <<: *backend-dev
    environment:
      <<: *db-env
      ARGUS_DB_NAME: argus_test   # schema tests recreate this database; never the dev one
      ARGUS_RULES_DIR: /app/rules
      # A leaked connection or a stuck lock fails the test in seconds instead of hanging.
      PGOPTIONS: "-c lock_timeout=20s -c statement_timeout=120s"
      # Its own Memgraph: Community holds one database, so tests never share the dev graph.
      ARGUS_GRAPH_URI: bolt://memgraph-test:7687
      ARGUS_GRAPH_PASSWORD: argus-graph-test
    networks: [data, graph]
    depends_on:
      postgres:
        condition: service_healthy
      memgraph-test:
        condition: service_healthy
    command: ["pytest"]

  # The tests' Memgraph: no volume, emptied by the tests themselves (tests/graph).
  memgraph-test:
    image: memgraph/memgraph:3.13.2@sha256:302a6622a9bd28191818801b7ea6e5931bc1cd0a0d1646333269a2237b1bdcb0
    profiles: [tools]
    environment:
      MEMGRAPH_USER: argus
      MEMGRAPH_PASSWORD: argus-graph-test
    # The dev flags, with the data in the container's /tmp and no durability: thrown away.
    command:
      - --telemetry-enabled=false
      - --metrics-address=127.0.0.1
      - --monitoring-address=127.0.0.1
      - --storage-mode=IN_MEMORY_TRANSACTIONAL
      - --storage-wal-enabled=false
      - --storage-snapshot-interval-sec=0
      - --storage-snapshot-on-exit=false
      - --query-execution-timeout-sec=600
      - --allow-load-csv=false
      - --log-level=WARNING
      - --log-file=
      - --also-log-to-stderr=true
    networks: [graph]
    <<: *hardened
    read_only: true
    tmpfs:
      - /tmp
      # Its data never outlives it, and its module directory is read-only, as `memgraph`'s is.
      - /var/lib/memgraph:uid=101,gid=103,mode=0750
      - /var/lib/memgraph/internal_modules:ro
    mem_limit: 4g
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/7687"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Phase 0 (ADR-0044, round M3): the opt-in graph and map budgets, at 300,000 and 1,000,000
  # resources. Its own Postgres sized like an 8 GiB RDS instance (the development one has 1 GiB,
  # and a backend was killed generating 300,000 resources there on 2026-10-31), its own
  # Memgraph with the production flags (durable, so the WAL's cost is measured), and a runner.
  # All three share the internal `budget` network only: nothing is published, nothing reaches
  # the development stack, and nothing has a route out.
  #   docker compose --profile budget run --rm budget          (300,000 resources)
  #   ARGUS_GRAPH_BUDGET_RESOURCES=1000000 docker compose --profile budget run --rm budget
  # Stop and empty it afterwards, naming the services. A `stop` with no service names stops
  # EVERY service of the project, including the development stack (a dead end, 2026-10-31):
  #   docker compose --profile budget rm -sfv postgres-budget memgraph-budget
  #   docker volume rm argus_pgdata-budget argus_memgraph-budget
  postgres-budget:
    image: postgres:17-trixie@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
    profiles: [budget]
    environment:
      POSTGRES_DB: argus
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: argus-budget
    # RDS-like for 8 GiB: a quarter of it for shared buffers, JIT off as on Argus's RDS
    # recommendation, room for the parallel workers' shared memory (shm_size).
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=6GB
      - -c
      - work_mem=64MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - max_wal_size=8GB
      - -c
      - jit=off
    volumes:
      - pgdata-budget:/var/lib/postgresql/data
    networks: [budget]
    <<: *hardened
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    mem_limit: 8g
    shm_size: 2g
    pids_limit: 512
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argus -d argus"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The `memgraph` service's image and flags, on its own volume.
  memgraph-budget:
    image: memgraph/memgraph:3.13.2@sha256:302a6622a9bd28191818801b7ea6e5931bc1cd0a0d1646333269a2237b1bdcb0
    profiles: [budget]
    environment:
      MEMGRAPH_USER: argus
      MEMGRAPH_PASSWORD: argus-graph-budget
    command:
      - --telemetry-enabled=false
      - --metrics-address=127.0.0.1
      - --monitoring-address=127.0.0.1
      - --storage-mode=IN_MEMORY_TRANSACTIONAL
      - --storage-wal-enabled=true
      - --storage-snapshot-interval-sec=300
      - --storage-snapshot-on-exit=false
      - --query-execution-timeout-sec=600
      - --memory-limit=3584
      - --allow-load-csv=false
      - --log-level=WARNING
      - --log-file=
      - --also-log-to-stderr=true
    volumes:
      - memgraph-budget:/var/lib/memgraph
    networks: [budget]
    <<: *hardened
    read_only: true
    tmpfs:
      - /tmp
      - /var/lib/memgraph/internal_modules:ro
    mem_limit: 4g
    pids_limit: 512
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/7687"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The runner: the test image against the two above. Only the budget tests run here.
  budget:
    <<: [*backend-dev, *hardened]
    profiles: [budget]
    environment:
      <<: *db-env
      ARGUS_DB_HOST: postgres-budget
      ARGUS_DB_NAME: argus_test   # the session fixture recreates it; never a dev database
      ARGUS_DB_PASSWORD: argus-budget
      ARGUS_RULES_DIR: /app/rules
      # A stuck lock fails in seconds; generating 1,000,000 resources takes minutes per statement.
      PGOPTIONS: "-c lock_timeout=20s -c statement_timeout=30min"
      ARGUS_GRAPH_URI: bolt://memgraph-budget:7687
      ARGUS_GRAPH_PASSWORD: argus-graph-budget
      ARGUS_GRAPH_BUDGET: "1"
      ARGUS_GRAPH_BUDGET_RESOURCES: ${ARGUS_GRAPH_BUDGET_RESOURCES:-300000}
    networks: [budget]
    depends_on:
      postgres-budget:
        condition: service_healthy
      memgraph-budget:
        condition: service_healthy
    mem_limit: 6g
    command: ["pytest", "-p", "no:cacheprovider", "-s", "tests/budget/test_graph_budget.py", "tests/budget/test_map_budget.py"]

  lint:
    <<: *backend-dev
    environment: {}
    depends_on:
      gitleaks:
        condition: service_completed_successfully
      policy-check:
        condition: service_completed_successfully
    command:
      - sh
      - -c
      - ruff check . && ruff format --check . && mypy && lint-imports

  # Read-only rule as a build failure: cfn-lint, then deploy/aws/policycheck over every
  # template in deploy/aws, then the check's own tests.
  policy-check:
    build: ./deploy/aws/policycheck
    image: argus-policycheck:local
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./deploy/aws:/work:ro
    profiles: [tools]
    environment:
      PYTHONPYCACHEPREFIX: /tmp/pycache
    command:
      - sh
      - -c
      - >-
        cfn-lint /work/*.yaml &&
        python check_readonly.py /work/*.yaml &&
        pytest -q -p no:cacheprovider

  # Phase 0: scrub one spike run into backend/tests/fixtures. Reads raw output and keeps the
  # mapping (original values) in the spike directory, outside the repository.
  #   docker compose run --rm scrub-fixtures --run-id RUN_ID
  scrub-fixtures:
    <<: *backend-dev
    environment: {}
    volumes:
      - ./backend:/app
      - ${ARGUS_SPIKE_DIR:-${HOME}/.local/share/argus-spike}:/spike
    entrypoint:
      ["python", "tests/tooling/scrub_fixtures.py", "--spike-dir", "/spike", "--out", "tests/fixtures"]

  lock:
    build:
      context: ./backend
      target: uv-base
    image: argus-backend:uv-base
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    volumes:
      - ./backend:/app
    profiles: [tools]
    command: ["uv", "lock"]

  gitleaks:
    image: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/repo:ro
    profiles: [tools]
    # The working tree (including uncommitted files), then every commit in history once one
    # exists. A secret removed from the tree but still in history is still a leak.
    entrypoint: ["sh", "-c"]
    command:
      - >-
        gitleaks dir /repo --redact --no-banner &&
        if git -c safe.directory=/repo -C /repo rev-parse --verify -q HEAD >/dev/null;
        then gitleaks git /repo --redact --no-banner; fi

  scan:
    image: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
    volumes:
      - .:/repo:ro
      - trivy-cache:/root/.cache/trivy
      # The worker image holds upstream tools (Prowler ships moto's fake test keys), so it is
      # scanned for vulnerabilities only; secrets in our code are covered by the fs scan and
      # gitleaks. Read access to the local image store, to scan images built here. This socket is
      # root-equivalent on the host; the scan service is local tooling and never deployed.
      - /var/run/docker.sock:/var/run/docker.sock
    profiles: [tools]
    # emulated/ is skipped: the emulator's git-ignored output, whose keys are moto's placeholders
    # and never a real account's (.gitleaks.toml allowlists it for the same reason).
    entrypoint: ["sh", "-c"]
    command:
      - >-
        trivy fs --scanners vuln,misconfig,secret --exit-code 1 --severity CRITICAL,HIGH
        --ignorefile /repo/.trivyignore --skip-dirs /repo/.git --skip-dirs /repo/emulated
        --helm-values /repo/charts/argus/ci/minimal-values.yaml /repo &&
        trivy image --scanners vuln,secret --exit-code 1 --severity CRITICAL --ignore-unfixed
        --ignorefile /repo/.trivyignore argus-backend:runtime &&
        trivy image --scanners vuln,secret --exit-code 1 --severity CRITICAL --ignore-unfixed
        --ignorefile /repo/.trivyignore argus-web:runtime &&
        trivy image --scanners vuln --exit-code 1 --severity CRITICAL --ignore-unfixed
        --ignorefile /repo/.trivyignore argus-backend:worker &&
        trivy image --scanners vuln,secret --exit-code 1 --severity CRITICAL --ignore-unfixed
        --ignorefile /repo/.trivyignore
        memgraph/memgraph:3.13.2@sha256:302a6622a9bd28191818801b7ea6e5931bc1cd0a0d1646333269a2237b1bdcb0

  # The chart's static checks, offline (deploy/kind/check.sh): lint, render, kubeconform,
  # digests, the values that must be refused, the Postgres image the same as above.
  chart-check:
    build: ./deploy/kind
    image: argus-kind:local
    user: "${UID:-1000}:${GID:-1000}"
    network_mode: none
    volumes:
      - ./charts:/work/charts:ro
      - ./deploy/kind:/work/kind:ro
      - ./compose.yaml:/work/compose.yaml:ro
    profiles: [tools]
    command: ["/work/kind/check.sh"]

  # The chart on a throwaway kind cluster (deploy/kind/run.sh): up, test, down. Build the images
  # first (docker compose build migrate worker web). It drives the host's Docker, so it holds the
  # socket (root-equivalent on the host) and the host network (the cluster's API and the local
  # registry are on 127.0.0.1). Local tooling, never deployed, like `scan`.
  kind:
    image: argus-kind:local
    # The socket is root's; this tool is local and never deployed.
    user: "0:0"
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./charts:/work/charts:ro
      - ./deploy/kind:/work/kind:ro
    profiles: [tools]
    entrypoint: ["/work/kind/run.sh"]
    command: ["test"]

networks:
  # The internet-facing side is only web's published port (default network).
  default: {}
  # web <-> api. Internal: no route out. A fixed subnet so web's address, the API's only
  # trusted proxy, is stable; dynamic addresses come from the upper half. If the subnet
  # collides with a local network, change it here, in web's ipv4_address and in
  # ARGUS_TRUSTED_PROXIES together.
  edge:
    internal: true
    ipam:
      config:
        - subnet: 172.31.250.0/28
          ip_range: 172.31.250.8/29
  # api, worker, migrate, seed, test <-> Postgres. Internal: no route out.
  data:
    internal: true
  # worker -> the internet (S3). Not internal, and no other service joins it.
  egress: {}
  # worker (and test) <-> Memgraph (ADR-0044). Internal: no route out.
  graph:
    internal: true
  # emulate <-> moto (dev only). Internal: no route out.
  emulate:
    internal: true
  # The budget profile's Postgres, Memgraph and runner. Internal: no route out.
  budget:
    internal: true

volumes:
  pgdata:
  memgraph-data:
  pgdata-budget:
  memgraph-budget:
  raw:
  staging:
  trivy-cache:
  frontend-node-modules:
  pnpm-store:

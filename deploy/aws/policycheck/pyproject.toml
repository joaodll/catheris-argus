[project]
name = "argus-policycheck"
version = "0.1.0"
description = "Build-time checks for the Argus scanner-role CloudFormation templates"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pyyaml>=6.0.2",
    "cfn-lint>=1.20",
    "pytest>=8.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

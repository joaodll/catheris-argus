AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  CatherIs Argus read-only scanner role. Deployed to every scanned account (a StackSet
  later; one stack for the Phase 0 spike). Grants read access only and explicitly denies
  secret and data-plane reads. Argus never changes anything in this account.

# Permission sources, pinned to the tool versions in the worker image (backend/Dockerfile):
#   - arn:aws:iam::aws:policy/SecurityAudit and job-function/ViewOnlyAccess (AWS managed)
#   - Prowler permissions/prowler-additions-policy.json (5.44.0; identical in 5.45.0, so the
#     Description below keeps 5.44.0: changing it would replace the policy), WITHOUT
#     securityhub:BatchImportFindings (a write; Argus never sends findings to Security Hub) and
#     WITHOUT ecr:BatchGetImage, ecr:GetDownloadUrlForLayer, lambda:GetLayerVersion,
#     logs:FilterLogEvents (bulk reads of
#     images and log content, denied below: ADR-0018)
#   - CloudFox v2.0.5 misc/aws/cloudfox-policy.json
# On a collector upgrade, re-diff both upstream policies against this file.
# deploy/aws/check_readonly.py (run by `docker compose run --rm lint`) fails the build on any
# action that is not a read, on wildcards, or if the Deny statement is weakened.

Parameters:
  HubRoleArn:
    Type: String
    Description: ARN of the Argus hub role (EKS Pod Identity); for the Phase 0 spike, your SSO role. A role, never an IAM user with long-lived keys.
    AllowedPattern: "^arn:aws[a-z-]*:iam::[0-9]{12}:role/.+$"
  ExternalId:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: Shared ExternalId the hub presents when assuming this role.
  RoleName:
    Type: String
    Default: ArgusScanner

Resources:
  ScannerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      Description: CatherIs Argus read-only scanner (Prowler, CloudFox, Steampipe)
      # Assumed by role chaining from the hub, which caps sessions at one hour; the SDKs
      # refresh profile-based credentials during long scans.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref HubRoleArn
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/SecurityAudit
        - !Sub arn:${AWS::Partition}:iam::aws:policy/job-function/ViewOnlyAccess
        - !Ref ProwlerAdditionsPolicy
        - !Ref CloudFoxAdditionsPolicy
        - !Ref DenySecretReadsPolicy

  ProwlerAdditionsPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Read permissions Prowler 5.44.0 needs beyond SecurityAudit and ViewOnlyAccess
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ProwlerReadOnly
            Effect: Allow
            Resource: "*"
            Action:
              - account:Get*
              - amplify:ListApps
              - amplify:ListBranches
              - appstream:Describe*
              - appstream:List*
              - backup:List*
              - backup:Get*
              - bedrock:List*
              - bedrock:Get*
              - cloudtrail:GetInsightSelectors
              - codeartifact:List*
              - codebuild:BatchGet*
              - codebuild:ListReportGroups
              - cognito-idp:GetUserPoolMfaConfig
              - datapipeline:DescribePipelines
              - datapipeline:GetPipelineDefinition
              - datapipeline:ListPipelines
              - dlm:Get*
              - drs:Describe*
              - ds:Get*
              - ds:Describe*
              - ds:List*
              - dynamodb:GetResourcePolicy
              - ec2:GetEbsEncryptionByDefault
              - ec2:GetSnapshotBlockPublicAccessState
              - ec2:GetInstanceMetadataDefaults
              - ecr:Describe*
              - ecr:GetRegistryScanningConfiguration
              - elasticfilesystem:DescribeBackupPolicy
              - glue:GetConnections
              - glue:GetDevEndpoints
              - glue:GetSecurityConfiguration*
              - glue:SearchTables
              - glue:GetMLTransforms
              - inspector2:BatchGetFindingDetails
              - lambda:GetFunction*
              - lightsail:GetRelationalDatabases
              - macie2:GetMacieSession
              - macie2:GetAutomatedDiscoveryConfiguration
              - rolesanywhere:ListProfiles
              - rolesanywhere:ListTagsForResource
              - rolesanywhere:ListTrustAnchors
              - s3:GetAccountPublicAccessBlock
              - s3:GetObjectAcl
              - s3:ListBucket
              - shield:DescribeProtection
              - shield:GetSubscriptionState
              - securityhub:GetFindings
              - servicecatalog:Describe*
              - servicecatalog:List*
              - ssm:GetDocument
              - ssm-incidents:List*
              - states:ListTagsForResource
              - support:Describe*
              - tag:GetTagKeys
              - wellarchitected:List*
          - Sid: ProwlerApiGatewayReadOnly
            Effect: Allow
            Action: apigateway:GET
            Resource:
              - arn:*:apigateway:*::/restapis/*
              - arn:*:apigateway:*::/apis/*
              - arn:*:apigateway:*::/domainnames
              - arn:*:apigateway:*::/domainnames/*

  CloudFoxAdditionsPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Read permissions CloudFox v2.0.5 uses (its documented policy)
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudFoxReadOnly
            Effect: Allow
            Resource: "*"
            Action:
              - apigateway:GET
              - apprunner:DescribeService
              - apprunner:ListServices
              - cloudformation:DescribeStacks
              - cloudformation:GetTemplate
              - cloudformation:ListStacks
              - cloudfront:ListDistributions
              - cloudtrail:LookupEvents
              - codebuild:BatchGetProjects
              - codebuild:GetResourcePolicy
              - codebuild:ListProjects
              - dynamodb:ListTables
              - ec2:DescribeInstanceAttribute
              - ec2:DescribeInstances
              - ec2:DescribeNetworkInterfaces
              - ec2:DescribeRegions
              - ecr:DescribeImages
              - ecr:DescribeRepositories
              - ecs:DescribeTaskDefinition
              - ecs:ListClusters
              - ecs:ListTaskDefinitions
              - ecs:ListTasks
              - eks:DescribeCluster
              - eks:DescribeNodegroup
              - eks:ListClusters
              - eks:ListNodegroups
              - elasticache:DescribeCacheClusters
              - elasticache:DescribeCacheSubnetGroups
              - elasticache:DescribeReplicationGroups
              - elasticfilesystem:DescribeFileSystemPolicy
              - elasticfilesystem:DescribeFileSystems
              - elasticfilesystem:DescribeMountTargets
              - elasticloadbalancing:DescribeListeners
              - elasticloadbalancing:DescribeLoadBalancers
              - es:DescribeDomain
              - es:ListDomainNames
              - fsx:DescribeFileSystems
              - fsx:DescribeVolumes
              - glue:ListDevEndpoints
              - glue:ListJobs
              - grafana:ListWorkspaces
              - iam:GetAccountAuthorizationDetails
              - iam:ListAccessKeys
              - iam:ListRoles
              - iam:ListUsers
              - iam:SimulatePrincipalPolicy
              - lambda:GetFunctionUrlConfig
              - lambda:GetPolicy
              - lambda:ListFunctions
              - lightsail:GetContainerServices
              - lightsail:GetInstances
              - mq:DescribeBroker
              - mq:ListBrokers
              - organizations:ListAccounts
              - ram:GetResourceShares
              - ram:ListResources
              - rds:DescribeDBInstances
              - redshift:DescribeClusters
              - route53:ListHostedZones
              - route53:ListResourceRecordSets
              - s3:GetAccountPublicAccessBlock
              - s3:GetBucketLocation
              - s3:GetBucketPolicy
              - s3:GetBucketPolicyStatus
              - s3:GetBucketWebsite
              - s3:ListAllMyBuckets
              - sagemaker:DescribeModel
              - sagemaker:DescribeProcessingJob
              - sagemaker:DescribeTrainingJob
              - sagemaker:DescribeTransformJob
              - sagemaker:ListModels
              - sagemaker:ListProcessingJobs
              - sagemaker:ListTrainingJobs
              - sagemaker:ListTransformJobs
              - secretsmanager:ListSecrets
              - sns:GetTopicAttributes
              - sns:ListTopics
              - sqs:GetQueueAttributes
              - sqs:ListQueues
              - ssm:DescribeParameters
              - tag:GetResources

  # An explicit Deny wins over every Allow above, including the AWS managed policies if AWS
  # ever widens them. Two groups:
  #   - secret values and data-plane items: no Prowler or CloudFox check needs them;
  #   - code, images and log content (ADR-0018): Prowler's secrets-in-Lambda-code and
  #     secrets-in-logs checks need them and are given up, so a stolen scanner session can
  #     never pull every image and every function's code.
  # s3:GetObject and lambda:GetFunction are named exactly: s3:GetObjectAcl and
  # lambda:GetFunctionConfiguration stay allowed. API Gateway's GET reads configuration, except
  # on the API key paths, which return key values (includeValues, usage-plan keys).
  DenySecretReadsPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Argus never reads secret values, data-plane items, code, images, log content or API key values
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenySecretAndDataReads
            Effect: Deny
            Resource: "*"
            Action:
              - secretsmanager:GetSecretValue
              - secretsmanager:BatchGetSecretValue
              - ssm:GetParameter
              - ssm:GetParameters
              - ssm:GetParametersByPath
              - ssm:GetParameterHistory
              - kms:Decrypt
              - s3:GetObject
              - s3:GetObjectVersion
              - dynamodb:GetItem
              - dynamodb:BatchGetItem
              - dynamodb:Query
              - dynamodb:Scan
          - Sid: DenyCodeImageAndLogContent
            Effect: Deny
            Resource: "*"
            Action:
              - ecr:BatchGetImage
              - ecr:GetDownloadUrlForLayer
              - lambda:GetFunction
              - lambda:GetLayerVersion
              - logs:FilterLogEvents
              - logs:GetLogEvents
          - Sid: DenyApiKeyValues
            Effect: Deny
            Action: apigateway:GET
            Resource:
              - arn:*:apigateway:*::/apikeys
              - arn:*:apigateway:*::/apikeys/*
              - arn:*:apigateway:*::/usageplans/*/keys
              - arn:*:apigateway:*::/usageplans/*/keys/*

Outputs:
  ScannerRoleArn:
    Value: !GetAtt ScannerRole.Arn

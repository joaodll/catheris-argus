# One control plane and one worker, so the scheduler reaches the Kubernetes API on another node,
# as on EKS. kind's default CNI (kindnet with kube-network-policies) enforces NetworkPolicy.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  apiServerAddress: 127.0.0.1
  podSubnet: 10.244.0.0/16
  serviceSubnet: 10.96.0.0/12
nodes:
  - role: control-plane
  - role: worker
# Pulls from the local registry (localhost:<port>) go to its container on the kind network;
# run.sh writes the per-registry hosts.toml.
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"

# The chart on kind (run.sh). Every control stays on; only sizes, the registry and the
# addresses differ from production. run.sh adds the local registry, the image digests it pushed
# and the Kubernetes API's endpoint address.
secrets:
  existingSecret: argus-secrets
api:
  # kind's pod network: web's pods.
  trustedProxies: 10.244.0.0/16
  # Not the defaults, so run.sh proves the values reach the process.
  session: {idleMinutes: 45}
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 384Mi}
# No cloud identity on kind: scan Jobs answer the identity test there and run no scans.
identity:
  mode: none
postgres:
  storage: {size: 2Gi}
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}
scheduler:
  maxRunJobs: 2
scanJobs:
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 2Gi}
  tmpSize: 512Mi
  scratch: {size: 2Gi}
  # No node has these taints, so they change nothing here. They make the admission policy compile
  # and judge a real list; left empty, kind never saw a policy that won't compile. The 0 is a real
  # value, not "unset".
  tolerations:
    - {key: argus.catheris.io/scanners, operator: Exists, effect: NoSchedule}
    - {key: argus.catheris.io/draining, operator: Equal, value: "true", effect: NoExecute, tolerationSeconds: 0}
networkPolicy:
  # Link-local, the pod and Service networks, and the kind nodes' Docker network.
  scanEgressExcept: [169.254.0.0/16, 10.244.0.0/16, 10.96.0.0/12, 172.16.0.0/12]
# Every node matches, so migrate, rederive, retention and helm test's probe prove they still run
# with placement set; the toleration changes nothing, as above.
tasks:
  nodeSelector: {kubernetes.io/os: linux}
  tolerations:
    - {key: argus.catheris.io/tasks, operator: Exists, effect: NoSchedule}
# As above: run.sh reads it back from the API and from the retention Job.
retention:
  maxHistoryDays: 500

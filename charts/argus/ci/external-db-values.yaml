# A managed Postgres 18 over verify-full, Pod Identity, the ExternalSecret and an internal
# ingress: every optional branch of the templates.
images:
  registry: 111122223333.dkr.ecr.eu-west-1.amazonaws.com
  runtime: {repository: argus-backend, digest: "sha256:1111111111111111111111111111111111111111111111111111111111111111"}
  workerSteampipe: {repository: argus-backend, digest: "sha256:2222222222222222222222222222222222222222222222222222222222222222"}
  workerProwler: {repository: argus-backend, digest: "sha256:4444444444444444444444444444444444444444444444444444444444444444"}
  workerCloudfox: {repository: argus-backend, digest: "sha256:5555555555555555555555555555555555555555555555555555555555555555"}
  web: {repository: argus-web, digest: "sha256:3333333333333333333333333333333333333333333333333333333333333333"}
secrets:
  existingSecret: argus-secrets
externalSecret:
  enabled: true
  secretStoreRef: {name: aws-secrets-manager, kind: ClusterSecretStore}
  remoteKey: argus/production
database:
  ownerUser: argus_owner
postgres:
  enabled: false
  external:
    host: argus.cluster-example.eu-west-1.rds.amazonaws.com
    caConfigMap: rds-ca
    caKey: global-bundle.pem
    cidrs: [10.0.32.0/20]
api:
  trustedProxies: 10.0.0.0/16
  autoscaling: {enabled: true, minReplicas: 2, maxReplicas: 4, targetCPUUtilizationPercentage: 70, targetMemoryUtilizationPercentage: 80}
  nodeSelector: {argus.catheris.io/pool: platform}
web:
  autoscaling: {enabled: true, minReplicas: 2, maxReplicas: 3, targetCPUUtilizationPercentage: 70}
  ingress:
    enabled: true
    className: internal-nginx
    host: argus.internal.example
    tlsSecretName: argus-tls
identity:
  mode: podIdentity
serviceAccounts:
  scheduler:
    annotations: {example.com/owner: platform-team}
scanJobs:
  nodeSelector: {argus.catheris.io/pool: scanners}
  tolerations:
    - {key: scanners, operator: Exists, effect: NoSchedule}
  scratch: {size: 40Gi}
tasks:
  nodeSelector: {argus.catheris.io/pool: platform}
networkPolicy:
  kubeApi:
    cidrs: [10.0.0.10/32, 10.0.0.11/32]
  scanEgressExcept: [169.254.0.0/16, 10.0.0.0/16, 172.20.0.0/16]
  ipv6: true
  webIngressFrom:
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-nginx}}
      podSelector: {matchLabels: {app.kubernetes.io/name: ingress-nginx}}

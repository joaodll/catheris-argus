# CatherIs Argus on Kubernetes (ADR-0039, ADR-0040). Defaults are the production posture:
# every control on. Values marked "required" have no safe default; values.schema.json refuses
# an install without them.
#
# The namespace is Argus's alone: the NetworkPolicies deny everything to every pod in it, and
# it should carry the Pod Security label `pod-security.kubernetes.io/enforce: restricted`.

# The chart is published as catheris-argus, but what it creates is called argus: a release named
# argus gives argus-api, argus-run and so on, and the IAM role's trust policy names argus-run.
nameOverride: "argus"
fullnameOverride: ""

# Images, by digest only (`repository@sha256:...`). The chart never builds code and never pulls
# a tag. `registry` prefixes the three Argus images (an ECR registry, a local registry on kind).
images:
  registry: ""
  pullPolicy: IfNotPresent
  # argus-backend:runtime: api, scheduler, migrate, rederive, retention and the scan Jobs that
  # answer Test connection.
  runtime:
    repository: argus-backend
    digest: ""  # required
  # One image per tool for the scan Jobs (ADR-0046): the runtime plus that tool only, so a Job
  # pulls only what it runs. Build targets worker-steampipe, worker-prowler, worker-cloudfox.
  # Steampipe's also runs Vulnerabilities (the same export binary).
  workerSteampipe:
    repository: argus-backend
    digest: ""  # required
  workerProwler:
    repository: argus-backend
    digest: ""  # required
  workerCloudfox:
    repository: argus-backend
    digest: ""  # required
  # argus-backend:reports: the runtime plus the PDF renderer, for the report Job (ADR-0047). Its
  # Job runs on IRSA installs only, where reports are kept in S3.
  reports:
    repository: argus-backend
    digest: ""  # required
  web:
    repository: argus-web
    digest: ""  # required
  # The same image and digest as compose.yaml (checked by `chart-check`).
  postgres:
    repository: docker.io/library/postgres
    digest: "sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81"
imagePullSecrets: []

# One existing Secret holds every secret value; the chart never generates one (ADR-0040).
# Keys: ARGUS_DB_PASSWORD (the schema owner), ARGUS_API_DB_PASSWORD,
# ARGUS_WORKER_DB_PASSWORD, ARGUS_SCHEDULER_DB_PASSWORD, ARGUS_SECRET_KEYS,
# ARGUS_SECRET_KEY_ID; on IRSA installs, ARGUS_REPORTS_DB_PASSWORD (the report Job's role); for
# the first start only, ARGUS_BOOTSTRAP_ADMIN_PASSWORD or
# ARGUS_BOOTSTRAP_ADMIN_PASSWORD_HASH (below, `admin`). Each pod references only its own keys.
secrets:
  existingSecret: ""  # required

# Fills that Secret from AWS Secrets Manager with the External Secrets Operator, when it is
# installed. Off by default: the Secret can be created any other way.
externalSecret:
  enabled: false
  refreshInterval: 1h
  # external-secrets.io/v1beta1 for an operator older than 0.17.
  apiVersion: external-secrets.io/v1
  secretStoreRef:
    name: ""
    kind: ClusterSecretStore
  # A Secrets Manager secret holding a JSON object with the keys above.
  remoteKey: ""
  # The first admin's key, copied only while it is listed here: ARGUS_BOOTSTRAP_ADMIN_PASSWORD
  # or ARGUS_BOOTSTRAP_ADMIN_PASSWORD_HASH. Empty it after the first sign-in, then remove the
  # property from the Secrets Manager secret.
  bootstrapKeys: []

# The chart creates these service accounts, the only ones that hold anything:
#   <release>-run        the platform identity (IRSA, `identity` below); used by AWS scans and
#                        connection tests only
#   <release>-scheduler  allowed to create Jobs in this namespace (and nothing else)
#   <release>-api        on IRSA installs: the API's role, which reads reports (identity below)
#   <release>-report     on IRSA installs: the report Job's role, which writes reports
# Every other pod runs as the namespace's `default` account with no token mounted.
serviceAccounts:
  run:
    annotations: {}
  scheduler:
    annotations: {}

# The platform identity, on the `run` service account only.
identity:
  # irsa: the role ARN annotation; podIdentity: nothing on the account (the association is made
  # outside the chart) and egress to the Pod Identity agent; none: an access-key identity set in
  # the UI.
  mode: irsa
  roleArn: ""
  # Reports (ADR-0047) are kept in the reports/ folder of the raw-output bucket on IRSA installs,
  # and each side has its own role, never the platform identity: the API's reads reports/ only,
  # the report Job's writes reports/ only (docs/aws-policies.md). Required with mode irsa. With
  # another mode there are no reports, and the Reports screen says why.
  apiRoleArn: ""
  reportRoleArn: ""

# The first admin (ADR-0041): the migrate Job creates admin.username while no active admin
# exists, with the Secret's ARGUS_BOOTSTRAP_ADMIN_PASSWORD or ..._PASSWORD_HASH. Remove that key
# after the first sign-in; more users are added in Administration -> Users.
admin:
  username: admin

# Sign-in (ADR-0048). Set here, never in the UI: an Admin who could change it could choose who is
# Admin. So write access to these values, and to the metadata ConfigMap, is Admin access.
auth:
  # Password sign-in, the break-glass path. Turn it off once SSO works; to recover, turn it on
  # again, and the bootstrap admin and `admin-tools reset-password` work as before.
  localSignIn: true
  # The URL people use to reach Argus, https only (the ingress's). SAML's entity id and the
  # address the IdP answers to come from it, never from a request's headers.
  publicUrl: ""
  saml:
    enabled: false
    # A ConfigMap you create with the IdP's metadata XML, under idpMetadataKey. It is never
    # fetched from a URL. An IdP rolling its certificate can list both in it.
    idpMetadataConfigMap: ""
    idpMetadataKey: metadata.xml
    # The attribute of the IdP's answer that carries the user's groups.
    groupsAttribute: ""
    # The attribute holding the email address; empty means the NameID, which must then be one.
    emailAttribute: ""
    # The attribute holding the display name; empty means none.
    nameAttribute: ""
  # The exact group string the IdP sends (a name, or an object id on Entra ID) -> viewer,
  # operator or admin. The highest of a user's groups wins; a user in none is refused.
  groupRoles: {}

logLevel: INFO

database:
  name: argus
  # The schema owner the migrate Job connects as. It needs CREATEROLE on an external database.
  ownerUser: argus
  # The most connections each pod opens (ARGUS_DB_POOL_MAX, a hard cap). The render fails when
  # the worst case of every pod at once is above postgres.maxConnections less 3 reserved:
  #   api      x (replicas, or autoscaling.maxReplicas, + 1 rolling-update surge)
  #   scanJob  x (scheduler.maxRunJobs + scheduler.maxTestJobs)
  #   task     x 3 (migrate, rederive and retention at once) + 1 (Alembic's own)
  #   scheduler
  #   reportJob x scheduler.maxReportJobs, on IRSA installs
  # A pod below its own peak refuses to start: a scan Job holds 3 at once, migrate, rederive and
  # retention 2, a report Job 1. The api uses one per request in progress; more wait, then get
  # 503.
  pools:
    api: 10
    scheduler: 2
    scanJob: 3
    reportJob: 1
    task: 2

# Postgres 18 in the chart (a StatefulSet), or an external one with `enabled: false`.
postgres:
  enabled: true
  storage:
    size: 20Gi
    storageClassName: ""
  # What the database allows (max_connections). Every pod's pool must fit in it: see
  # database.pools. For an external database, set what it allows Argus.
  maxConnections: 200
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {memory: 1Gi}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  external:
    host: ""  # required when postgres.enabled is false
    port: 5432
    # Empty: verify-full with caConfigMap, otherwise require, which encrypts but does not verify
    # the server. verify-full and verify-ca are refused without caConfigMap.
    sslmode: ""
    # Optional: a ConfigMap holding the CA bundle that signs the database's certificate.
    caConfigMap: ""
    caKey: ca.crt
    # Optional: the database's address ranges, for the NetworkPolicies, on `port`. Empty: any
    # private address (RFC 1918, and fc00::/7 with networkPolicy.ipv6). A database outside those
    # ranges needs this set.
    cidrs: []

api:
  # Ignored while autoscaling is on.
  replicas: 2
  # required: the address range web's pods come from (the pod CIDR). The API believes
  # X-Forwarded-For only from it; the NetworkPolicy lets only web reach the API.
  trustedProxies: ""
  # A session ends after idleMinutes without use, and after absoluteHours whatever happens.
  session:
    idleMinutes: 30
    absoluteHours: 12
  # Failures within lockoutMinutes. One username from one address locks first; one address limits
  # spraying across usernames; one username from anywhere only at a far higher count, so one
  # attacker can't keep the administrator locked out.
  signIn:
    maxFailures: 5
    lockoutMinutes: 15
    maxFailuresPerAddress: 20
    maxFailuresPerUsername: 100
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    # 95 MiB idle, and each of 2 password checks at once holds 64 MiB: 231 MiB at peak (2026-11-05).
    limits: {memory: 384Mi}
  # A HorizontalPodAutoscaler on CPU (and memory, if set). Needs metrics-server, which EKS does
  # not install by default. maxReplicas counts in the connection budget (database.pools).
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: null
  nodeSelector: {}
  tolerations: []
  affinity: {}

web:
  # Ignored while autoscaling is on.
  replicas: 2
  resources:
    requests: {cpu: 50m, memory: 32Mi}
    limits: {memory: 128Mi}
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: null
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Off by default: reach the UI with `kubectl port-forward`. Without SSO (auth.saml) there is no
  # second factor, so keep any ingress internal or restricted to known source addresses. It must
  # be the one proxy in front of web, serve HTTPS, and be allowed in networkPolicy.webIngressFrom.
  ingress:
    enabled: false
    className: ""
    host: ""
    annotations: {}
    tlsSecretName: ""

# The scheduler queues the scans schedules call for and starts a scan Job for each (below). It
# never scans itself, holds no cloud identity, and runs as one replica.
scheduler:
  # How many scan Jobs run AWS scans at once, at most (the administration setting "max parallel
  # runs" can only lower it, ADR-0023), and how many more may start while connection tests
  # wait, so a test never waits behind a long scan.
  maxRunJobs: 4
  maxTestJobs: 1
  # Report Jobs at once, on IRSA installs (1 to 3). A PDF at every cap peaked at 1.37 GiB.
  maxReportJobs: 1
  resources:
    requests: {cpu: 50m, memory: 96Mi}
    limits: {memory: 256Mi}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Scan Jobs (ADR-0039, ADR-0046): on Kubernetes there is no long-running worker. The scheduler
# starts a short-lived Job for each piece of work; the Job does it and exits, and its credentials
# and temporary files go with it. There are four works, each a fixed template the admission
# policy pins (ADR-0040): `test` answers one queued connection test (the "Test connection"
# button) on the runtime image; `steampipe` (also Vulnerabilities), `prowler` and `cloudfox` each
# run one AWS scan of their tool on one account, then ingest, on that tool's image. A connection's
# tools still run in order. Only AWS connections are scanned here: Demo connections are for
# Docker Compose. Every scan Job has the AWS identity.
scanJobs:
  # Finished Jobs (and their logs) are deleted after this many seconds.
  ttlSecondsAfterFinished: 600
  # Steampipe has no overall time limit of its own: this is it. A scan past it counts as lost.
  activeDeadlineSeconds: 21600
  # One template per work, each with its own image and pod size (ADR-0046). The admission
  # policy pins each template whole, these resources included.
  work:
    # Test connection: STS and one marker object per tool folder, no tool.
    test:
      resources:
        requests: {cpu: 100m, memory: 256Mi}
        limits: {memory: 512Mi}
    # Steampipe and Vulnerabilities.
    steampipe:
      resources:
        requests: {cpu: 500m, memory: 2Gi}
        limits: {memory: 6Gi}
    prowler:
      resources:
        requests: {cpu: 500m, memory: 2Gi}
        limits: {memory: 6Gi}
    cloudfox:
      resources:
        requests: {cpu: 500m, memory: 2Gi}
        limits: {memory: 6Gi}
    # One report, on IRSA installs (ADR-0047). The renderer is capped at 2 GiB; a PDF at every
    # cap peaked at 1.37 GiB (2026-11-11). The file is written to the scratch volume, then sent
    # to S3 in one PUT.
    report:
      resources:
        requests: {cpu: 500m, memory: 2Gi}
        limits: {memory: 4Gi}
  # /tmp holds each scan's AWS profile and CloudFox's cache: memory-backed, as in Compose.
  tmpSize: 2Gi
  # The scan's raw output, on the node's disk until it is uploaded to S3, then deleted with the
  # pod (an emptyDir, never a volume claim). It can hold secret values: use encrypted node disks
  # (ADR-0032, ADR-0040).
  scratch:
    size: 20Gi
  nodeSelector: {}
  tolerations: []

# Where the pods that run once and exit go: migrate, rederive, retention and helm test's probe.
# With a taint or a CPU type that only some nodes have, set this like the other components, or
# these pods land on nodes the rest of Argus avoids.
tasks:
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Retention, a daily CronJob (UTC): drops the history older than the administration setting
# "History" (whole monthly partitions), the configurations no snapshot uses any more, and old
# rule loads. Without it the database grows for ever.
retention:
  schedule: "17 3 * * *"
  # The longest history an administrator may set in the UI. The API and retention both read it.
  # Lowering it below what is set in the UI deletes the history above it at the next retention.
  maxHistoryDays: 400
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}

networkPolicy:
  enabled: true
  # Every pod resolves names through these. With NodeLocal DNSCache, lookups go to a link-local
  # address on the node instead: allow it here, or point pods at kube-dns.
  dns:
    namespaceSelector: {kubernetes.io/metadata.name: kube-system}
    podSelector: {k8s-app: kube-dns}
  # required when enabled: the Kubernetes API's endpoint addresses (not only the Service's
  # ClusterIP: many CNIs filter after DNAT), for the scheduler.
  kubeApi:
    cidrs: []
    port: 443
  # AWS scans and connection tests reach port 443 anywhere except these. Add the cluster's pod
  # and service ranges; keep VPC endpoints for STS and S3 reachable.
  scanEgressExcept: [169.254.0.0/16]
  # On an IPv6 cluster: the same rule over ::/0, without link-local and EC2's own range
  # (instance metadata and the Pod Identity agent).
  ipv6: false
  scanEgressExceptIPv6: ["fe80::/10", "fd00:ec2::/32"]
  # required on IRSA installs: S3 and the regional STS endpoint, which the API and the report Job
  # reach for reports (ADR-0047). Their only route out of the cluster. The S3 prefix list's ranges
  # (aws ec2 describe-managed-prefix-lists) or your VPC endpoints' subnets; STS's interface
  # endpoint, or the region's STS ranges.
  awsEgressCidrs: []
  # Peers allowed to reach web on 8080 (an ingress controller). None by default:
  # `kubectl port-forward` is not filtered by NetworkPolicy.
  webIngressFrom: []

# Rejects any Job the scheduler creates that differs from its fixed templates (ADR-0040).
admissionPolicy:
  enabled: true
  # Turning the policy off must be acknowledged: a compromised scheduler could then start any
  # image as the `run` service account.
  acknowledgeUnenforced: false

# How many pods and Jobs can exist (review S1). pods 0: derived from the replicas (the
# autoscaling maximum when on) and the scan bounds.
resourceQuota:
  enabled: true
  pods: 0
  jobs: 60

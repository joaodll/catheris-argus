{{- /* How many pods and Jobs can exist (ADR-0040, review S1): the admission policy fixes what a
Job runs, this fixes how many a compromised scheduler can start. pods 0 derives the limit: every
replica (the autoscaling maximum when on) plus one surge pod each for api and web, the
scheduler, Postgres, the scan and connection-test bounds, migrate, rederive, retention and the
`helm test` probe. Finished pods do not count. */ -}}
{{- if .Values.resourceQuota.enabled }}
{{- $v := .Values }}
{{- $api := ternary $v.api.autoscaling.maxReplicas $v.api.replicas $v.api.autoscaling.enabled }}
{{- $web := ternary $v.web.autoscaling.maxReplicas $v.web.replicas $v.web.autoscaling.enabled }}
{{- $derived := add $api 1 $web 1 1 (ternary 1 0 $v.postgres.enabled) $v.scheduler.maxRunJobs $v.scheduler.maxTestJobs 3 1 }}
apiVersion: v1
kind: ResourceQuota
metadata:
  name: {{ include "argus.fullname" . }}
  labels:
    {{- include "argus.labels" (dict "root" . "component" "quota") | nindent 4 }}
spec:
  hard:
    pods: {{ $v.resourceQuota.pods | default $derived | quote }}
    count/jobs.batch: {{ $v.resourceQuota.jobs | quote }}
    count/cronjobs.batch: "1"
{{- end }}

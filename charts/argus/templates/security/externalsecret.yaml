{{- /* Optional (External Secrets Operator, off by default): fills the one Secret from a Secrets
Manager secret holding a JSON object. Only the keys of the contract are copied; anything else in
the remote secret stays out of the cluster. */ -}}
{{- if .Values.externalSecret.enabled }}
{{- $es := .Values.externalSecret }}
apiVersion: {{ $es.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.existingSecret }}
  labels:
    {{- include "argus.labels" (dict "root" . "component" "secrets") | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    name: {{ $es.secretStoreRef.name }}
    kind: {{ $es.secretStoreRef.kind }}
  target:
    name: {{ .Values.secrets.existingSecret }}
    creationPolicy: Owner
  data:
    {{- range $key := concat (list "ARGUS_DB_PASSWORD" "ARGUS_API_DB_PASSWORD" "ARGUS_WORKER_DB_PASSWORD" "ARGUS_SCHEDULER_DB_PASSWORD" "ARGUS_SECRET_KEYS" "ARGUS_SECRET_KEY_ID") $es.bootstrapKeys }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ $es.remoteKey }}
        property: {{ $key }}
    {{- end }}
{{- end }}

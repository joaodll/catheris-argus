{{- /* The scheduler's fixed Job templates, one per work (ADR-0039, ADR-0046), each submitted
byte for byte. */ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "argus.fullname" . }}-job-templates
  labels:
    {{- include "argus.labels" (dict "root" . "component" "scheduler") | nindent 4 }}
data:
  {{- range $work, $_ := include "argus.scanWorks" . | fromYaml }}
  {{ $work }}.json: {{ include "argus.scanJob" (dict "root" $ "work" $work) | fromYaml | toJson | quote }}
  {{- end }}

{{- /* Disruption budgets, declared in values (podDisruptionBudgets). api and web: a voluntary
disruption takes down at most maxUnavailable of each. Job pods (argus/work: scans, connection
tests, attack routes, reports): an integer minAvailable, the only form Kubernetes evaluates for pods
a Job owns; by default the most that can run at once, so a drain waits for a running Job instead of
losing it. Karpenter also honours the Job pods' do-not-disrupt annotation; nothing here stops a spot
reclaim or a node failure. */ -}}
{{- range $component := list "api" "web" "jobs" }}
{{- $budget := index $.Values.podDisruptionBudgets $component }}
{{- if $budget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "argus.fullname" $ }}-{{ $component }}
  labels:
    {{- include "argus.labels" (dict "root" $ "component" (ternary "scheduler" $component (eq $component "jobs"))) | nindent 4 }}
spec:
{{- if eq $component "jobs" }}
  minAvailable: {{ ternary (include "argus.jobPodCeiling" $ | int) $budget.minAvailable (kindIs "invalid" $budget.minAvailable) }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "argus.name" $ }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
    matchExpressions:
      - {key: argus/work, operator: Exists}
{{- else }}
  maxUnavailable: {{ $budget.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "argus.selectorLabels" (dict "root" $ "component" $component) | nindent 6 }}
{{- end }}
{{- end }}
{{- end }}

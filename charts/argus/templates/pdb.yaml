{{- /* api and web: a voluntary disruption (a node drain) takes down one pod at a time. */ -}}
{{- range $component := list "api" "web" }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "argus.fullname" $ }}-{{ $component }}
  labels:
    {{- include "argus.labels" (dict "root" $ "component" $component) | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "argus.selectorLabels" (dict "root" $ "component" $component) | nindent 6 }}
{{- end }}

{{- /* Postgres 17 in the chart: the same pinned image as compose.yaml. It runs as the image's
postgres user (999) from the start, so the entrypoint needs no root and no capabilities; the
data lives one level below the volume's root (which holds lost+found on many volumes). Off with
postgres.enabled=false for a managed database (ADR-0040). Its Service is in services.yaml. */ -}}
{{- define "argus.postgres.env" -}}
- name: POSTGRES_DB
  value: {{ .Values.database.name | quote }}
- name: POSTGRES_USER
  value: {{ .Values.database.ownerUser | quote }}
- name: POSTGRES_PASSWORD
  valueFrom:
    secretKeyRef:
      name: {{ .Values.secrets.existingSecret }}
      key: ARGUS_DB_PASSWORD
- name: PGDATA
  value: /var/lib/postgresql/data/pgdata
{{- end }}
{{- define "argus.postgres.probes" -}}
ports:
  - {name: postgres, containerPort: 5432}
# initdb on a new volume can take a while; then ready while it accepts connections, and
# restarted only when the port stops answering for a minute.
startupProbe:
  exec:
    command: [pg_isready, -h, 127.0.0.1, -U, {{ .Values.database.ownerUser | quote }}, -d, {{ .Values.database.name | quote }}]
  periodSeconds: 5
  failureThreshold: 60
readinessProbe:
  exec:
    command: [pg_isready, -h, 127.0.0.1, -U, {{ .Values.database.ownerUser | quote }}, -d, {{ .Values.database.name | quote }}]
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
livenessProbe:
  tcpSocket: {port: postgres}
  periodSeconds: 10
  failureThreshold: 6
{{- end }}
{{- define "argus.postgres.volumes" -}}
- name: run
  emptyDir:
    sizeLimit: 1Mi
# Parallel query workers share memory here; the runtime's default is 64 MiB.
- name: shm
  emptyDir:
    medium: Memory
    sizeLimit: 256Mi
{{- end }}
{{- if .Values.postgres.enabled }}
{{- $name := printf "%s-postgres" (include "argus.fullname" .) }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "argus.labels" (dict "root" . "component" "postgres") | nindent 4 }}
spec:
  replicas: 1
  serviceName: {{ $name }}
  selector:
    matchLabels:
      {{- include "argus.selectorLabels" (dict "root" . "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "argus.labels" (dict "root" . "component" "postgres") | nindent 8 }}
    spec:
      {{- /* A clean shutdown checkpoints; a killed one replays WAL at the next start. Ownership
      is fixed once, not on every start of a large volume. */}}
      {{- include "argus.podSpec" (dict "root" . "component" "postgres" "uid" 999 "grace" 60
        "fsGroupChangePolicy" "OnRootMismatch" "placement" .Values.postgres
        "tmp" (dict "sizeLimit" "256Mi") "volumes" (include "argus.postgres.volumes" .)
        "containers" (include "argus.container" (dict "root" . "name" "postgres" "tmp" false
          "image" (include "argus.image" (dict "root" . "image" .Values.images.postgres "registry" false))
          "args" (list "-c" (printf "max_connections=%d" (int .Values.postgres.maxConnections)))
          "env" (include "argus.postgres.env" .) "extra" (include "argus.postgres.probes" .)
          "resources" .Values.postgres.resources
          "mounts" "- {name: data, mountPath: /var/lib/postgresql/data}\n- {name: run, mountPath: /var/run/postgresql}\n- {name: tmp, mountPath: /tmp}\n- {name: shm, mountPath: /dev/shm}"))) | nindent 6 }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "argus.selectorLabels" (dict "root" . "component" "postgres") | nindent 10 }}
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.postgres.storage.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage.size }}
{{- end }}

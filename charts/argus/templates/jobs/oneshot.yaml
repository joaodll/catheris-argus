{{- /* The one-shot Jobs (ADR-0039). Plain Jobs, not hooks: each name carries a hash of its pod,
so it runs once per image or setting change and `helm upgrade` never waits on it. Kept after it
finishes, so an upgrade with no change does not run it again.
- migrate: migrations, then LOGIN and passwords for the app roles, as the schema owner. api, the
  scheduler and the run Jobs wait for the schema themselves (migrate --wait). It retries while
  the database is still starting.
- rederive: derive again after a rule upgrade. It waits for the schema, then for the ingests
  running now (an advisory lock), then re-derives each connection whose rules changed; with none,
  it exits at once. As argus_worker. It may wait behind a scan's ingest, which can last as
  long as the run's own deadline. */ -}}
{{- $passwords := "" }}
{{- range $key := list "ARGUS_API_DB_PASSWORD" "ARGUS_WORKER_DB_PASSWORD" "ARGUS_SCHEDULER_DB_PASSWORD" }}
{{- $passwords = printf "%s\n%s" $passwords (include "argus.secretEnv" (dict "root" $ "key" $key)) }}
{{- end }}
{{- /* The first admin, created once while there is no active admin (ADR-0041): admin.username
with a password or its hash, when the Secret has one. The operator removes it after the first
sign-in; with neither, migrate creates no one. */ -}}
{{- $passwords = printf "%s\n- name: ARGUS_BOOTSTRAP_ADMIN_USERNAME\n  value: %s" $passwords (.Values.admin.username | quote) }}
{{- range $key := list "ARGUS_BOOTSTRAP_ADMIN_PASSWORD" "ARGUS_BOOTSTRAP_ADMIN_PASSWORD_HASH" }}
{{- $passwords = printf "%s\n%s" $passwords (include "argus.secretEnv" (dict "root" $ "key" $key "optional" true)) }}
{{- end }}
{{- $jobs := list
  (dict "component" "migrate" "backoffLimit" 6 "activeDeadlineSeconds" 1800
    "command" (list "python" "-m" "argus.entrypoints.migrate" "--config" "/opt/argus/alembic.ini")
    "db" (dict "root" $ "user" .Values.database.ownerUser "key" "ARGUS_DB_PASSWORD" "pool" "task")
    "env" (trim $passwords)
    "resources" (dict "requests" (dict "cpu" "100m" "memory" "128Mi") "limits" (dict "memory" "512Mi")))
  (dict "component" "rederive" "backoffLimit" 2 "activeDeadlineSeconds" (add .Values.scanJobs.activeDeadlineSeconds 3600)
    "command" (list "python" "-m" "argus.entrypoints.rederive")
    "db" (dict "root" $ "user" "argus_worker" "key" "ARGUS_WORKER_DB_PASSWORD" "pool" "task")
    "resources" .Values.retention.resources "wait" true) }}
{{- range $job := $jobs }}
{{- $pod := include "argus.taskPod" (merge (dict "root" $) $job) }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "argus.oneShotName" (dict "root" $ "name" $job.component "pod" $pod) }}
  labels:
    {{- include "argus.labels" (dict "root" $ "component" $job.component) | nindent 4 }}
spec:
  backoffLimit: {{ $job.backoffLimit }}
  activeDeadlineSeconds: {{ $job.activeDeadlineSeconds }}
  template:
    {{- $pod | nindent 4 }}
{{- end }}

{{- /* The chart's service accounts, the only ones that hold anything (ADR-0040). Every other pod
runs as the namespace's `default` account with no token mounted.
- run: the AWS identity (IRSA annotation from `identity`). Used by scan Jobs only (AWS scans and
  connection tests).
- scheduler: allowed to create Jobs in this namespace (scheduler/rbac.yaml), nothing else. Its
  token is mounted in the scheduler's pod only (scheduler/deployment.yaml). */ -}}
{{- $run := deepCopy .Values.serviceAccounts.run.annotations }}
{{- if and (eq .Values.identity.mode "irsa") .Values.identity.roleArn }}
{{- $_ := set $run "eks.amazonaws.com/role-arn" .Values.identity.roleArn }}
{{- end }}
{{- $accounts := list (dict "name" "run" "annotations" $run) (dict "name" "scheduler" "annotations" .Values.serviceAccounts.scheduler.annotations) }}
{{- /* IRSA installs keep reports in S3 (ADR-0047 round 5): the API reads them and the report Job
writes them, each with its own role, never the platform identity. Neither token is mounted; EKS's
webhook adds the IRSA token only. */ -}}
{{- if include "argus.reportsInS3" . }}
{{- $accounts = append $accounts (dict "name" "api" "annotations" (dict "eks.amazonaws.com/role-arn" .Values.identity.apiRoleArn)) }}
{{- $accounts = append $accounts (dict "name" "report" "annotations" (dict "eks.amazonaws.com/role-arn" .Values.identity.reportRoleArn)) }}
{{- end }}
{{- range $sa := $accounts }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "argus.serviceAccount" (dict "root" $ "name" $sa.name) }}
  labels:
    {{- include "argus.labels" (dict "root" $ "component" $sa.name) | nindent 4 }}
  {{- with $sa.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}

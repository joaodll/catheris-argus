{{- /* The HTTP API (/api/v1), behind web's nginx. Connects as argus_api; no Kubernetes token,
no cloud identity (ADR-0040). Reached only by web; reaches only Postgres (NetworkPolicy). Its
Service, disruption budget and autoscaler are in services.yaml, pdb.yaml and hpa.yaml. */ -}}
{{- define "argus.api.env" -}}
{{ include "argus.keyringEnv" . }}
{{ include "argus.historyBound.env" . }}
# Session and sign-in limits bound every user's exposure, so they are the operator's.
- name: ARGUS_SESSION_IDLE_MINUTES
  value: {{ .Values.api.session.idleMinutes | int | quote }}
- name: ARGUS_SESSION_ABSOLUTE_HOURS
  value: {{ .Values.api.session.absoluteHours | int | quote }}
- name: ARGUS_LOGIN_MAX_FAILURES
  value: {{ .Values.api.signIn.maxFailures | int | quote }}
- name: ARGUS_LOGIN_LOCKOUT_MINUTES
  value: {{ .Values.api.signIn.lockoutMinutes | int | quote }}
- name: ARGUS_LOGIN_MAX_FAILURES_PER_IP
  value: {{ .Values.api.signIn.maxFailuresPerAddress | int | quote }}
- name: ARGUS_LOGIN_MAX_FAILURES_PER_USERNAME
  value: {{ .Values.api.signIn.maxFailuresPerUsername | int | quote }}
# Kubernetes offers real connections only: Demo connections are for Docker Compose (ADR-0039).
- name: ARGUS_DEMO_CONNECTIONS
  value: "false"
# Only web's pods may set the client IP; the NetworkPolicy lets only them in.
- name: ARGUS_TRUSTED_PROXIES
  value: {{ .Values.api.trustedProxies | quote }}
# Sign-in (ADR-0048), from the values only. The API refuses to start on a half set.
- name: ARGUS_LOCAL_SIGN_IN
  value: {{ .Values.auth.localSignIn | quote }}
{{- with .Values.auth.saml }}
{{- if .enabled }}
- name: ARGUS_PUBLIC_URL
  value: {{ $.Values.auth.publicUrl | trimSuffix "/" | quote }}
- name: ARGUS_SAML_IDP_METADATA_FILE
  value: {{ printf "/etc/argus/saml/%s" .idpMetadataKey | quote }}
- name: ARGUS_SAML_GROUPS_ATTRIBUTE
  value: {{ .groupsAttribute | quote }}
- name: ARGUS_SAML_EMAIL_ATTRIBUTE
  value: {{ .emailAttribute | quote }}
- name: ARGUS_SAML_NAME_ATTRIBUTE
  value: {{ .nameAttribute | quote }}
- name: ARGUS_SAML_GROUP_ROLES
  value: {{ $.Values.auth.groupRoles | toJson | quote }}
{{- end }}
{{- end }}
{{- end }}
{{- /* The IdP's metadata, from the operator's ConfigMap, read-only. */}}
{{- define "argus.api.samlVolume" -}}
{{- if .Values.auth.saml.enabled -}}
- name: saml-idp
  configMap:
    name: {{ .Values.auth.saml.idpMetadataConfigMap }}
{{- end }}
{{- end }}
{{- define "argus.api.samlMount" -}}
{{- if .Values.auth.saml.enabled -}}
- {name: saml-idp, mountPath: /etc/argus/saml, readOnly: true}
{{- end }}
{{- end }}
{{- define "argus.api.ports" -}}
ports:
  - {name: http, containerPort: 8000}
# Ready when the database answers; alive while the process answers. A slow database takes the
# pod out of the Service, never restarts it.
readinessProbe:
  httpGet: {path: /api/v1/ready, port: http}
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
livenessProbe:
  httpGet: {path: /api/v1/health, port: http}
  initialDelaySeconds: 10
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 3
{{- end }}
{{- $db := dict "root" . "user" "argus_api" "key" "ARGUS_API_DB_PASSWORD" "pool" "api" }}
{{- include "argus.deployment" (dict "root" . "component" "api" "v" .Values.api "pod" (dict
  "grace" 30 "db" true
  "initContainers" (include "argus.waitForSchema" $db)
  "volumes" (include "argus.api.samlVolume" .)
  "containers" (include "argus.container" (dict "root" . "name" "api" "db" $db
    "mounts" (include "argus.api.samlMount" .)
    "command" (list "python" "-m" "argus.entrypoints.api")
    "env" (include "argus.api.env" .) "extra" (include "argus.api.ports" .)
    "resources" .Values.api.resources)))) }}

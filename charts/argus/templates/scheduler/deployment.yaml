{{- /* The scheduler (ADR-0039): one replica, never two at once, never runs work, no cloud
identity, no Service. The only pod with a Kubernetes token: it creates Jobs (rbac.yaml). */ -}}
{{- define "argus.scheduler.env" -}}
- name: ARGUS_MAX_RUN_JOBS
  value: {{ .Values.scheduler.maxRunJobs | quote }}
- name: ARGUS_MAX_TEST_JOBS
  value: {{ .Values.scheduler.maxTestJobs | quote }}
- name: ARGUS_JOB_TEMPLATES_DIR
  value: /etc/argus/jobs
{{- end }}
{{- define "argus.scheduler.probes" -}}
# It touches this file on every pass; a wedged loop stops touching it.
livenessProbe:
  exec:
    command:
      - python
      - -c
      - "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/argus-scheduler.alive') > 120)"
  initialDelaySeconds: 30
  periodSeconds: 30
  failureThreshold: 3
{{- end }}
{{- $db := dict "root" . "user" "argus_scheduler" "key" "ARGUS_SCHEDULER_DB_PASSWORD" "pool" "scheduler" }}
{{- include "argus.deployment" (dict "root" . "component" "scheduler" "v" .Values.scheduler "single" true
  "annotations" (dict "checksum/job-templates" (include (print $.Template.BasePath "/collectors/job-templates-configmap.yaml") . | sha256sum))
  "pod" (dict
    "serviceAccount" (include "argus.serviceAccount" (dict "root" . "name" "scheduler")) "token" true
    "grace" 10 "db" true
    "volumes" (printf "- name: job-templates\n  configMap:\n    name: %s-job-templates" (include "argus.fullname" .))
    "initContainers" (include "argus.waitForSchema" $db)
    "containers" (include "argus.container" (dict "root" . "name" "scheduler" "db" $db
      "command" (list "python" "-m" "argus.entrypoints.scheduler")
      "env" (include "argus.scheduler.env" .) "extra" (include "argus.scheduler.probes" .)
      "resources" .Values.scheduler.resources
      "mounts" "- {name: job-templates, mountPath: /etc/argus/jobs, readOnly: true}")))) }}

# What every proxied API location shares. proxy_pass stays in the template: only it is filled in.
include /etc/nginx/snippets/security-headers.conf;
proxy_http_version 1.1;
proxy_set_header Host $host;
# Overwrite, never append: the API trusts this header from nginx only, so it must hold the client's
# address as nginx established it, and nothing the client sent.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 30s;
